<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排行榜</title>
  <style>
    body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#160f0c;color:#f0e6d2;}
    .container{max-width:460px;margin:0 auto;padding:16px;}
    h2{color:#f5b942;text-align:center;}
    .row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;
         background:#241812;border:1px solid #4a3226;margin-bottom:6px;}
    .row.me{border-color:#f5b942;box-shadow:0 0 10px #f5b94255;}
    .rank{width:32px;text-align:center;font-weight:900;font-size:18px;color:#c9a06a;}
    .name{flex:1;font-weight:700;}
    .score{color:#f5b942;font-weight:900;}
    a{color:#a08a6f;text-decoration:none;display:block;text-align:center;margin-top:16px;}
    .empty{text-align:center;color:#a08a6f;margin-top:40px;}
  </style>
</head>
<body>
<div class="container">
  <h2>🏆 排行榜</h2>
  {% if rows %}
    {% for r in rows %}
    <div class="row {% if r[0] == me %}me{% endif %}">
      <div class="rank">
        {% if loop.index == 1 %}🥇{% elif loop.index == 2 %}🥈{% elif loop.index == 3 %}🥉{% else %}{{ loop.index }}{% endif %}
      </div>
      <div class="name">{{ r[0] }}</div>
      <div class="score">{{ r[1] }} 分</div>
    </div>
    {% endfor %}
  {% else %}
    <p class="empty">还没有人上榜，快去对战吧！</p>
  {% endif %}
  <a href="/battle">← 返回对战大厅</a>
</div>
</body>
</html>
