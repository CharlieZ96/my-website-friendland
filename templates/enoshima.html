<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>江之岛</title>
<style>
  :root{--ink:#262B33;--muted:#6B7683;--grape:#6D4FA3;--marigold:#F5A623;--paper:#fff;--line:#C6D0DA;}
  *{box-sizing:border-box}
  body{margin:0;background:#D9E2EC;color:var(--ink);
       font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:18px 12px 40px}
  .wrap{max-width:560px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  h1{font-size:22px;margin:0}
  h1 em{font-style:normal;color:var(--grape)}
  .back{font-size:13px;color:var(--muted);text-decoration:none}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin:2px 0 12px}
  .mapcard{background:var(--paper);border-radius:20px;padding:8px;box-shadow:0 10px 28px rgba(38,43,51,.14)}
  .map{width:100%;height:auto;display:block;border-radius:14px}
  /* 建筑：可点、悬浮、按压，附带轻微呼吸高光提示（像老虎机） */
  .spot{cursor:pointer;transform-box:fill-box;transform-origin:center bottom;transition:transform .14s ease}
  .spot:hover{transform:translateY(-5px)}
  .spot:active{transform:translateY(-1px) scale(.985)}
  .spot .glow{opacity:0;transition:opacity .2s}
  .spot:hover .glow{opacity:.9}
  .spot .halo{transform-box:fill-box;transform-origin:center;animation:halo 3.6s ease-in-out infinite}
  @keyframes halo{0%,100%{opacity:.0}50%{opacity:.55}}
  .sign{font-weight:800;fill:#fff}
  .signd{font-weight:800;fill:#3a2b18}
  .modal-bg{position:fixed;inset:0;background:rgba(38,43,51,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-bg[hidden]{display:none}
  .modal{background:#fff;border-radius:18px;padding:22px 20px;max-width:300px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,.25);text-align:center}
  .modal .emo{font-size:40px;line-height:1;margin-bottom:8px}
  .modal h3{margin:0 0 6px;font-size:18px}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:14px}
  .modal .btn{font-weight:700;font-size:14px;cursor:pointer;border:2px solid var(--ink);border-radius:12px;padding:10px 22px;background:var(--marigold);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
  .modal .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><h1>🏝️ <em>江之岛</em></h1><a class="back" href="/plaza">← 回牧场</a></div>
  <p class="hint">点地图上的建筑逛一逛～（更多玩法马上就来）</p>
  <div class="mapcard">
    <svg class="map" viewBox="0 0 480 466" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc0f5"/><stop offset="60%" stop-color="#bfe6ff"/><stop offset="100%" stop-color="#e6f6ff"/></linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d9fd6"/><stop offset="100%" stop-color="#8fd0ea"/></linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9e08c"/><stop offset="55%" stop-color="#88cf74"/><stop offset="100%" stop-color="#6cbf63"/></linearGradient>
        <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff7d6" stop-opacity=".95"/><stop offset="100%" stop-color="#fff7d6" stop-opacity="0"/></radialGradient>
        <linearGradient id="islG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8e39f"/><stop offset="100%" stop-color="#6fbf6f"/></linearGradient>
        <linearGradient id="lh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e9f0"/></linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfeaf8"/><stop offset="55%" stop-color="#9fd0ec"/><stop offset="60%" stop-color="#bfe3f5"/><stop offset="100%" stop-color="#8ec6e6"/></linearGradient>
        <linearGradient id="wall1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff9ef"/><stop offset="1" stop-color="#f2e6d2"/></linearGradient>
        <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd0e8"/><stop offset="1" stop-color="#3aa9d6"/></linearGradient>
      </defs>

      <!-- ===== 天空 / 海 / 沙滩 / 草地 ===== -->
      <rect x="0" y="0" width="480" height="600" fill="url(#grass)"/>

      <!-- 云 -->

        <g opacity=".85"><ellipse cx="180" cy="96" rx="24" ry="10"/><ellipse cx="198" cy="101" rx="18" ry="8"/></g>
      </g>
      <!-- 海 -->
      <path d="M0 150 H480 V244 Q360 232 240 244 T0 240 Z" fill="url(#sea)"/>
      <g stroke="#eaf7ff" stroke-width="3" stroke-linecap="round" opacity=".7" fill="none">
        <path d="M40 186 q7 -5 14 0 t14 0"/><path d="M150 168 q7 -5 14 0 t14 0"/><path d="M250 196 q7 -5 14 0 t14 0"/><path d="M410 176 q7 -5 14 0 t14 0"/><path d="M120 214 q7 -5 14 0 t14 0"/>
      </g>
      <!-- 沙滩 -->
      <path d="M0 236 Q120 224 250 240 T480 232 L480 272 Q300 262 150 274 T0 268 Z" fill="#f2e2b4"/>
      <path d="M0 236 Q120 224 250 240 T480 232" fill="none" stroke="#e4cf94" stroke-width="2"/>

      <!-- 蜿蜒小路 -->
      <path d="M150 270 Q120 330 190 372 Q250 408 300 446" fill="none" stroke="#eaddb4" stroke-width="16" stroke-linecap="round"/>
      <path d="M150 270 Q120 330 190 372 Q250 408 300 446" fill="none" stroke="#f4ecce" stroke-width="8" stroke-linecap="round"/>

      <!-- 装饰树 & 花 -->
      <g>
        <g transform="translate(35,330)"><rect x="-4" y="12" width="8" height="16" rx="3" fill="#8a5a34"/><circle cx="0" cy="2" r="16" fill="#7cc47f"/><circle cx="-11" cy="9" r="11" fill="#6bb86f"/><circle cx="11" cy="9" r="11" fill="#8ed08f"/><circle cx="0" cy="-9" r="11" fill="#93d694"/></g>
        <g transform="translate(445,300) scale(.9)"><rect x="-4" y="12" width="8" height="16" rx="3" fill="#8a5a34"/><circle cx="0" cy="2" r="16" fill="#7cc47f"/><circle cx="-11" cy="9" r="11" fill="#6bb86f"/><circle cx="11" cy="9" r="11" fill="#8ed08f"/></g>
        <g transform="translate(60,470) scale(.8)"><rect x="-4" y="12" width="8" height="16" rx="3" fill="#8a5a34"/><circle cx="0" cy="2" r="15" fill="#7cc47f"/><circle cx="10" cy="8" r="10" fill="#8ed08f"/></g>
        <g fill="none">
          <g transform="translate(120,430)"><circle r="3" fill="#fff"/><circle r="1.1" fill="#ffd23c"/></g>
          <g transform="translate(390,470)"><circle r="3" fill="#ff9ec8"/><circle r="1.1" fill="#ffd23c"/></g>
          <g transform="translate(360,250)"><circle r="3" fill="#ffe27a"/><circle r="1.1" fill="#ffd23c"/></g>
        </g>

        <path d="M232 250 Q276 236 300 214" fill="none" stroke="#e2be86" stroke-width="4"/>
        <g stroke="#a9824f" stroke-width="2"><line x1="248" y1="238" x2="248" y2="250"/><line x1="270" y1="230" x2="270" y2="243"/><line x1="290" y1="220" x2="290" y2="232"/></g>
      </g>

      <!-- ================= 江之岛（灯塔 + 鸟居，海中小岛） ================= -->

        <ellipse class="glow" cx="360" cy="150" rx="86" ry="70" fill="#fff6cf"/>
        <!-- 岛的礁石断崖 -->
        <path d="M300 210 Q300 176 360 172 Q424 176 420 210 Q420 226 360 232 Q300 226 300 210 Z" fill="#8b7a63"/>
        <path d="M306 206 Q312 214 322 206 Q332 216 344 206 Q356 216 368 206 Q380 216 392 206 Q404 214 414 206 L414 210 Q360 226 306 210 Z" fill="#6f6151"/>
        <!-- 绿顶（分层） -->
        <ellipse cx="360" cy="182" rx="60" ry="22" fill="url(#islG)"/>
        <ellipse cx="346" cy="174" rx="40" ry="15" fill="#a8e39f" opacity=".8"/>
        <ellipse cx="384" cy="180" rx="24" ry="10" fill="#8ed08f" opacity=".7"/>

        <g><rect x="402" y="170" width="4" height="9" fill="#7a4f2c"/><circle cx="404" cy="166" r="8" fill="#6fbf74"/></g>

        <!-- 灯塔（细节：塔身条纹 + 观景台 + 灯室 + 光晕） -->
        <ellipse class="halo" cx="392" cy="120" rx="26" ry="10" fill="#fff0a8"/>
        <rect x="382" y="112" width="20" height="52" rx="3" fill="url(#lh)"/>
        <g fill="#ff7a59"><rect x="382" y="112" width="20" height="8"/><rect x="382" y="132" width="20" height="8"/><rect x="382" y="152" width="20" height="8"/></g>
        <rect x="378" y="104" width="28" height="9" rx="2" fill="#4c5666"/>
        <g stroke="#39414d" stroke-width="1.4"><line x1="382" y1="108" x2="382" y2="113"/><line x1="392" y1="108" x2="392" y2="113"/><line x1="402" y1="108" x2="402" y2="113"/></g>
        <rect x="384" y="94" width="16" height="11" rx="2" fill="#ffe07a"/><circle cx="392" cy="99" r="3.2" fill="#fff7d0"/>
        <path d="M386 90 h12 l-3 4 h-6 z" fill="#c94b2e"/><rect x="390" y="84" width="4" height="6" fill="#c94b2e"/>
        <!-- 招牌 -->
        <rect x="330" y="214" width="60" height="16" rx="4" fill="#6D4FA3"/>
        <text class="sign" x="360" y="225" font-size="11" text-anchor="middle">江之岛</text>
      </g>

      <!-- ================= 上岛屋（海边木造钓具店，架在栈桥上） ================= -->
      <g class="spot" data-spot="上岛屋" data-emo="🎣">
        <ellipse class="glow" cx="120" cy="300" rx="86" ry="66" fill="#fff6cf"/>
        <!-- 栈桥支柱 -->
        <g fill="#9c7648"><rect x="70" y="300" width="7" height="34"/><rect x="112" y="304" width="7" height="34"/><rect x="158" y="300" width="7" height="34"/></g>
        <rect x="58" y="296" width="120" height="9" rx="2" fill="#c79a63"/>
        <rect x="58" y="296" width="120" height="4" fill="#e0bd88"/>
        <!-- 屋身：木板墙 -->
        <rect x="74" y="248" width="92" height="50" rx="3" fill="#e7c593"/>
        <g stroke="#d3ab6e" stroke-width="1.5"><line x1="74" y1="262" x2="166" y2="262"/><line x1="74" y1="276" x2="166" y2="276"/><line x1="74" y1="290" x2="166" y2="290"/></g>
        <!-- 屋顶：杉皮/瓦，带屋檐 -->
        <path d="M66 250 L120 216 L174 250 Z" fill="#4f9aa3"/>
        <path d="M66 250 L120 216 L174 250" fill="none" stroke="#3d7c84" stroke-width="2"/>
        <path d="M66 250 H174 L168 256 H72 Z" fill="#3d7c84"/>
        <!-- 门 + 暖帘 + 窗 -->
        <rect x="108" y="266" width="22" height="32" rx="1" fill="#6f4a2a"/>
        <rect x="106" y="264" width="26" height="8" fill="#2f6f8f"/><text class="sign" x="119" y="270" font-size="6" text-anchor="middle">釣具</text>
        <rect x="84" y="268" width="16" height="14" fill="#bfe6ea"/><line x1="92" y1="268" x2="92" y2="282" stroke="#8fb9c2"/><line x1="84" y1="275" x2="100" y2="275" stroke="#8fb9c2"/>
        <!-- 鱼竿、浮标、渔网道具 -->
        <line x1="168" y1="296" x2="186" y2="238" stroke="#8a5a2b" stroke-width="2.4"/>
        <line x1="186" y1="238" x2="182" y2="272" stroke="#cfd8e0" stroke-width="1"/>
        <ellipse cx="181" cy="276" rx="5" ry="3" fill="#7fb3e8"/><path d="M186 276 l5 -3 v6 z" fill="#7fb3e8"/>
        <g><circle cx="70" cy="256" r="4" fill="#e2554f"/><circle cx="70" cy="256" r="1.6" fill="#fff"/><circle cx="70" cy="266" r="4" fill="#f0c04a"/></g>
        <!-- 招牌 -->
        <rect x="80" y="230" width="52" height="16" rx="4" fill="#F5A623"/>
        <text class="signd" x="106" y="241" font-size="11" text-anchor="middle">上岛屋</text>
      </g>

      <!-- ================= JR江之岛（车站 + 月台 + 江ノ電绿色小电车） ================= -->
      <g class="spot" data-spot="JR江之岛" data-emo="🚉">
        <ellipse class="glow" cx="150" cy="400" rx="120" ry="66" fill="#fff6cf"/>
        <!-- 铁轨 -->
        <g stroke="#a9906a" stroke-width="3"><line x1="30" y1="430" x2="270" y2="430"/><line x1="30" y1="440" x2="270" y2="440"/></g>
        <g fill="#c79a63"><rect x="40" y="428" width="5" height="14"/><rect x="78" y="428" width="5" height="14"/><rect x="116" y="428" width="5" height="14"/><rect x="154" y="428" width="5" height="14"/><rect x="192" y="428" width="5" height="14"/><rect x="230" y="428" width="5" height="14"/></g>
        <!-- 站房 -->
        <rect x="150" y="356" width="96" height="60" rx="3" fill="#f4ede0"/>
        <rect x="150" y="356" width="96" height="60" rx="3" fill="url(#wall1)"/>
        <path d="M142 356 H254 L246 338 H150 Z" fill="#c14b3f"/>
        <path d="M142 356 H254 L250 362 H146 Z" fill="#9c3a30"/>
        <!-- 时钟 + 门窗 -->
        <circle cx="198" cy="348" r="7" fill="#fff" stroke="#9c3a30" stroke-width="1.5"/><line x1="198" y1="348" x2="198" y2="344" stroke="#333"/><line x1="198" y1="348" x2="201" y2="349" stroke="#333"/>
        <rect x="164" y="378" width="20" height="38" fill="#7a5333"/><rect x="164" y="378" width="20" height="38" fill="none" stroke="#5f3f26"/>
        <rect x="198" y="378" width="40" height="20" fill="#bfe0ea"/><g stroke="#8fb9c2"><line x1="218" y1="378" x2="218" y2="398"/><line x1="198" y1="388" x2="238" y2="388"/></g>
        <!-- 月台雨棚 -->
        <rect x="30" y="396" width="118" height="5" rx="2" fill="#5a6472"/>
        <g fill="#7b8492"><rect x="36" y="401" width="4" height="16"/><rect x="120" y="401" width="4" height="16"/></g>
        <!-- 江ノ電 绿色小电车 -->
        <g>
          <rect x="42" y="404" width="72" height="28" rx="6" fill="#3f7d4a"/>
          <rect x="42" y="404" width="72" height="9" rx="5" fill="#2f5f38"/>
          <rect x="46" y="428" width="64" height="4" fill="#cbb98a"/>
          <g fill="#dff3e6"><rect x="49" y="415" width="13" height="11" rx="1.5"/><rect x="66" y="415" width="13" height="11" rx="1.5"/><rect x="83" y="415" width="13" height="11" rx="1.5"/><rect x="100" y="415" width="9" height="11" rx="1.5"/></g>
          <rect x="44" y="410" width="4" height="4" fill="#ffe07a"/>
          <circle cx="58" cy="434" r="4" fill="#33404a"/><circle cx="98" cy="434" r="4" fill="#33404a"/>
        </g>
        <!-- 招牌 JR江ノ島 -->

      </g>

      <!-- ================= TOYOBA（现代玻璃展厅 4S 店 + 展车） ================= -->
      <g class="spot" data-spot="TOYOBA" data-emo="🚗">
        <ellipse class="glow" cx="360" cy="390" rx="110" ry="70" fill="#fff6cf"/>
        <!-- 铺装地面 -->
        <rect x="286" y="398" width="164" height="44" rx="4" fill="#d7dee6"/>
        <!-- 展厅主体（挑高玻璃幕墙） -->
        <rect x="292" y="330" width="150" height="72" rx="4" fill="#eef3f8"/>
        <rect x="292" y="330" width="150" height="14" fill="#d63b47"/>
        <rect x="292" y="344" width="150" height="4" fill="#a52a34"/>
        <!-- 玻璃幕墙（反光斜条） -->

          <rect x="300" y="352" width="134" height="46" rx="2" fill="url(#glass)"/>
          <g stroke="#bcd9ea" stroke-width="1.5"><line x1="334" y1="352" x2="334" y2="398"/><line x1="368" y1="352" x2="368" y2="398"/><line x1="402" y1="352" x2="402" y2="398"/><line x1="300" y1="374" x2="434" y2="374"/></g>
          <g fill="#ffffff" opacity=".5"><polygon points="308,352 322,352 300,388 300,372"/><polygon points="360,352 372,352 340,398 328,398"/></g>
        </g>
        <!-- 展车（玻璃内一辆蓝车） -->
        <g>
          <path d="M338 384 q6 -12 22 -12 q14 0 20 12 z" fill="#3f7fd6"/>
          <rect x="330" y="384" width="60" height="12" rx="6" fill="#4f8fe0"/>
          <path d="M346 384 q5 -8 14 -8 q10 0 14 8 z" fill="#bfe0f5"/>
          <circle cx="344" cy="396" r="5" fill="#2b3540"/><circle cx="376" cy="396" r="5" fill="#2b3540"/>
        </g>
        <!-- 门前一辆红色展车 -->
        <g transform="translate(300,414)">
          <path d="M8 12 q6 -13 22 -13 q16 0 22 13 z" fill="#e04b45"/>
          <rect x="0" y="12" width="62" height="13" rx="6" fill="#ef5b54"/>
          <path d="M16 12 q5 -8 14 -8 q11 0 14 8 z" fill="#ffd7d3"/>
          <circle cx="15" cy="26" r="5.5" fill="#2b3540"/><circle cx="47" cy="26" r="5.5" fill="#2b3540"/>
          <circle cx="15" cy="26" r="2" fill="#c6ccd4"/><circle cx="47" cy="26" r="2" fill="#c6ccd4"/>
        </g>
        <!-- 彩旗 -->
        <g><line x1="300" y1="318" x2="438" y2="312" stroke="#c6ccd4" stroke-width="1"/>
          <path d="M312 316 l0 8 l7 -4 z" fill="#F5A623"/><path d="M340 315 l0 8 l7 -4 z" fill="#3f7fd6"/><path d="M368 314 l0 8 l7 -4 z" fill="#e04b45"/><path d="M396 313 l0 8 l7 -4 z" fill="#5FBF8F"/><path d="M424 313 l0 8 l7 -4 z" fill="#F5A623"/></g>
        <!-- 招牌 TOYOBA -->
        <rect x="316" y="316" width="102" height="17" rx="3" fill="#d63b47"/>
        <text class="sign" x="367" y="328" font-size="12" text-anchor="middle" letter-spacing="1.5">TOYOBA</text>
      </g>

    </svg>
  </div>
</div>

<!-- 敬请期待 弹层 -->
<div id="soon" class="modal-bg" hidden>
  <div class="modal">
    <div class="emo" id="soonEmo">🚧</div>
    <h3 id="soonTitle">敬请期待</h3>
    <p id="soonDesc"></p>
    <button class="btn" id="soonOk">知道啦</button>
  </div>
</div>

<script>
  const soon=document.getElementById('soon');
  function openSoon(name, emo){
    document.getElementById('soonEmo').textContent=emo||'🚧';
    document.getElementById('soonTitle').textContent=name;
    document.getElementById('soonDesc').textContent='「'+name+'」的玩法还在施工，很快就能进来逛啦～';
    soon.hidden=false;
  }
  document.querySelectorAll('.spot').forEach(g=>{
    g.addEventListener('click',()=>openSoon(g.dataset.spot, g.dataset.emo));
  });
  document.getElementById('soonOk').addEventListener('click',()=>soon.hidden=true);
  soon.addEventListener('click',e=>{ if(e.target.id==='soon') soon.hidden=true; });
</script>
</body>
</html>
