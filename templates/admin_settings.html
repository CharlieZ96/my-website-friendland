<!DOCTYPE html>
{% from "_appbar.html" import appbar, head with context %}
<html lang="{{ 'en' if lang == 'en' else 'zh-CN' }}">
<head>{{ head(_('后台设置')) }}</head>
<body>
    {{ appbar(_('后台设置'), [('/hub', _('返回大厅'))]) }}
    <main class="page">
        {% set admin_page = 'settings' %}{% include "_admin_nav.html" %}
        {% include "_flash.html" %}
        <section class="sheet" style="max-width:640px;">
            <h2>{{ _('抽卡限制') }}</h2>
            <form class="form-grid" method="POST">
                <label class="check">
                    <input type="checkbox" name="draw_limit_on" {% if limit_on %}checked{% endif %}>
                    {{ _('开启每日抽卡限制') }}
                </label>
                <div style="max-width:220px;">
                    <label class="lbl" for="draw_limit_count">{{ _('每天可抽次数') }}</label>
                    <input id="draw_limit_count" type="number" name="draw_limit_count" value="{{ limit_count }}" min="1">
                </div>
                <div class="form-actions"><button class="btn btn-primary" type="submit">{{ _('保存设置') }}</button></div>
            </form>
        </section>
    </main>
</body>
</html>
