<!DOCTYPE html>
<html>
<head>
    <title>注册</title>
</head>
<body>
    <h1>用户注册</h1>

    <form action="/register" method="post">
        <p>
            用户名:
            <input type="text" name="username">
        </p>
        <p>
            密码:
            <input type="password" name="password">
        </p>
        <button type="submit">注册</button>
    </form>
<a href="/"><button>返回首页</button></a>
</body>
</html>
