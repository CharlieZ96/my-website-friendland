<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#f4f6f8; }
        .card { background:white; padding:40px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); width:300px; }
        h2 { text-align:center; color:#333; margin-top:0; }
        input { width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:6px; box-sizing:border-box; font-size:15px; }
        button { width:100%; padding:12px; margin-top:12px; background:#4a90e2; color:white; border:none; border-radius:6px; font-size:16px; cursor:pointer; }
        .msg { color:#e74c3c; text-align:center; }
        .link { text-align:center; margin-top:12px; font-size:14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>修改密码</h2>
        {% with messages = get_flashed_messages() %}
          {% for m in messages %}<p class="msg">{{ m }}</p>{% endfor %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="old_password" placeholder="原密码" required>
            <input type="password" name="new_password" placeholder="新密码（至少6位）" required>
            <input type="password" name="confirm_password" placeholder="再次输入新密码" required>
            <button type="submit">确认修改</button>
        </form>
        <div class="link"><a href="/hub">← 返回主页</a></div>
    </div>
</body>
</html>
