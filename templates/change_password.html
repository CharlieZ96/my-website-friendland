<!DOCTYPE html>
{% from "_appbar.html" import appbar, head with context %}
<html lang="{{ 'en' if lang == 'en' else 'zh-CN' }}">
<head>{{ head(_('修改密码')) }}</head>
<body>
    {{ appbar(_('修改密码'), [('/hub', _('返回大厅'))]) }}
    <main class="page page-narrow">
        <div class="page-head">
            <h1>{{ _('修改密码') }}</h1>
            <p>{{ _('改完需要用新密码重新登录。本站不支持找回密码，请记好新密码。') }}</p>
        </div>
        {% include "_flash.html" %}
        <form class="sheet form-grid" method="POST">
            <div>
                <label class="lbl" for="old_password">{{ _('原密码') }}</label>
                <input id="old_password" type="password" name="old_password" autocomplete="current-password" required>
            </div>
            <div>
                <label class="lbl" for="new_password">{{ _('新密码（至少 6 位）') }}</label>
                <input id="new_password" type="password" name="new_password" autocomplete="new-password" minlength="6" required>
            </div>
            <div>
                <label class="lbl" for="confirm_password">{{ _('再次输入新密码') }}</label>
                <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" minlength="6" required>
            </div>
            <div class="form-actions"><button class="btn btn-primary" type="submit">{{ _('修改密码') }}</button></div>
        </form>
    </main>
</body>
</html>
