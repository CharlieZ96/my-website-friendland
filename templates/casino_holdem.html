<!DOCTYPE html>
<html lang="{{ 'en' if lang == 'en' else 'zh-CN' }}">
<head>
{% include "_i18n.html" %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ _('德州扑克') }}</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b1020;color:#eaf2ff;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px 10px 24px}
  .wrap{max-width:560px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  h1{font-size:19px;margin:0}
  h1 em{font-style:normal;color:#ffd85a}
  .coins{font-size:13px;color:#ffd85a;font-weight:800}
  .back{font-size:13px;color:#8fa0c8;text-decoration:none;cursor:pointer;border:none;background:none}
  .felt{position:relative;background:radial-gradient(120% 90% at 50% 30%,#1c6a48,#124030);border:3px solid #6b4a2c;border-radius:120px/70px;padding:14px 12px;box-shadow:inset 0 0 40px rgba(0,0,0,.4);min-height:330px}
  .opps{display:flex;justify-content:space-around;gap:8px;margin-bottom:4px}
  .seat{background:rgba(6,12,24,.5);border:2px solid #2f5a45;border-radius:12px;padding:6px 8px;min-width:96px;text-align:center;transition:border-color .2s}
  .seat.turn{border-color:#ffd85a;box-shadow:0 0 12px rgba(255,216,90,.6)}
  .seat.folded{opacity:.45}
  .seat .nm{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
  .seat .nm .dealer{display:inline-block;background:#eaf2ff;color:#111;border-radius:50%;width:15px;height:15px;line-height:15px;font-size:10px;margin-left:3px}
  .seat .stk{font-size:11px;color:#9fe0c0}
  .seat .st{font-size:10px;color:#ffd85a;min-height:13px}
  .seat .betchip{font-size:11px;color:#ffd85a;min-height:14px}
  .cards{display:flex;gap:3px;justify-content:center;margin:3px 0}
  .card{width:30px;height:42px;border-radius:5px;background:#f6f8ff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;line-height:1;box-shadow:0 2px 4px rgba(0,0,0,.35);border:1px solid #cdd6e6}
  .card.sm{width:24px;height:34px;font-size:12px}
  .card.red{color:#e5194b}
  .card.back{background:repeating-linear-gradient(45deg,#3552a0,#3552a0 4px,#2a3f80 4px,#2a3f80 8px);color:transparent;border-color:#26356a}
  .card .su{font-size:12px}
  .card.sm .su{font-size:10px}
  .board{display:flex;gap:5px;justify-content:center;align-items:center;margin:12px 0}
  .potline{text-align:center;font-size:14px;font-weight:800;color:#ffd85a;margin:4px 0}
  .phase{text-align:center;font-size:12px;color:#9fb3d8;margin-bottom:6px}
  .me{margin-top:10px;background:rgba(6,12,24,.55);border:2px solid #2f5a45;border-radius:14px;padding:8px}
  .me.turn{border-color:#ffd85a;box-shadow:0 0 14px rgba(255,216,90,.5)}
  .metop{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .metop .who{font-size:13px;font-weight:800}
  .timer{height:5px;background:#1a2440;border-radius:3px;overflow:hidden;margin-top:6px}
  .timer i{display:block;height:100%;background:#ffd85a;width:100%;transition:width 1s linear}
  .controls{margin-top:10px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap}
  .btn{flex:1;min-width:74px;border:2px solid #000;border-radius:11px;padding:11px 6px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:2px 2px 0 #000;color:#04121a}
  .btn.fold{background:#ff6b6b}.btn.check{background:#7CFFB2}.btn.call{background:#27e3ff}.btn.raise{background:#ffd85a}.btn.allin{background:#ff5da2}
  .btn.ready{background:#7CFFB2}.btn.unready{background:#c7d0e0}
  .btn:active{transform:translate(2px,2px);box-shadow:0 0 0 #000}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .raisebox{display:flex;align-items:center;gap:8px;margin:8px 0}
  .raisebox input[type=range]{flex:1}
  .raiseval{font-weight:800;color:#ffd85a;min-width:52px;text-align:right}
  .wait{text-align:center;color:#9fb3d8;font-size:13px;padding:6px;line-height:1.7}
  .banner{text-align:center;background:rgba(255,216,90,.14);border:1px solid #ffd85a;border-radius:12px;padding:8px;margin-top:8px;font-size:13px}
  .banner b{color:#ffd85a}
  .log{margin-top:10px;font-size:11px;color:#8fa0c8;background:rgba(6,12,24,.4);border-radius:10px;padding:8px;max-height:96px;overflow:auto;line-height:1.7}
  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#101830;border:1px solid #ffd85a;color:#ffd85a;font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
  #toast.on{opacity:.98}
  .rules{font-size:11px;color:#6f80a8;text-align:center;margin-top:10px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>🂡 <em>{{ _('德州扑克') }}</em></h1>
    <div><span class="coins">🪙 <span id="coins">…</span></span> &nbsp; <button class="back" id="leave">← {{ _('离开') }}</button></div>
  </div>

  <div class="felt">
    <div class="phase" id="phase">{{ _('连接中…') }}</div>
    <div class="opps" id="opps"></div>
    <div class="board" id="board"></div>
    <div class="potline" id="pot"></div>
    <div id="me"></div>
  </div>

  <div class="controls" id="controls"></div>
  <div class="banner" id="banner" hidden></div>
  <div class="log" id="log"></div>
  <p class="rules">{{ _('2~3 人真人对局 · 大盲') }} <span id="bb">10</span>/{{ _('小盲') }} <span id="sb">5</span> · {{ _('进场自选额度，每局最多押') }} <span id="mb">500</span> {{ _('金币 · 摊牌赢家通吃 · 超时自动过牌/弃牌') }}</p>
</div>
<div id="toast"></div>

<script>const RID = {{ rid }};</script>
<script src="/static/pet_sprite.js"></script>
<script>
const SUIT = {s:"♠",h:"♥",d:"♦",c:"♣"};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2000);}
function cardHTML(c, sm){
  if(!c) return '';
  if(c==='??') return `<div class="card${sm?' sm':''} back">■</div>`;
  const r=c[0]==='T'?'10':c[0]; const s=c[1]; const red=(s==='h'||s==='d');
  return `<div class="card${sm?' sm':''}${red?' red':''}"><span>${r}</span><span class="su">${SUIT[s]||''}</span></div>`;
}
let LAST=null;
let EDIT_BUY=false;   // 是否正在“改额度”（临时展开选择器）
let CTRL_SIG=null;    // 控制区状态签名：状态没变就不重建，免得每 1.6s 轮询把滑块重置/闪烁
let BUY_VAL=null;     // 记住玩家在进场滑块上拖到的值，重建时不丢

function render(v){
  if(v.error){ document.getElementById('phase').textContent=v.error; toast(v.error); return; }
  LAST=v;
  if(v.phase!=='waiting' && v.phase!=='showdown') EDIT_BUY=false;
  document.getElementById('coins').textContent = v.coins;
  document.getElementById('bb').textContent = v.bb; document.getElementById('sb').textContent = v.sb;
  var mbEl=document.getElementById('mb'); if(mbEl && v.max_buyin) mbEl.textContent = v.max_buyin;
  const PH={waiting:__('等待玩家准备'),preflop:__('翻牌前'),flop:__('翻牌'),turn:__('转牌'),river:__('河牌'),showdown:__('摊牌')};
  document.getElementById('phase').textContent = (PH[v.phase]||v.phase) + (v.hand_no?`　·　${__('第 {p0} 局',{p0:(v.hand_no)})}`:'');

  // 对手席（除自己外）
  const opps=v.seats.filter(s=>!s.is_me);
  document.getElementById('opps').innerHTML = opps.map(s=>seatHTML(s,v)).join('') || ('<div class="wait">'+__('还没有其他玩家，等人来～')+'</div>');

  // 公共牌
  const board=v.board||[];
  let bhtml = board.map(c=>cardHTML(c)).join('');
  for(let i=board.length;i<5;i++) bhtml += `<div class="card" style="opacity:.18;background:#0d2a1e;border-color:#2f5a45;color:transparent">·</div>`;
  document.getElementById('board').innerHTML = (v.phase==='waiting') ? '' : bhtml;
  document.getElementById('pot').textContent = (v.phase==='waiting') ? '' : ((__('底池')+' ')+(v.pot||0));

  // 自己
  const me=v.seats.find(s=>s.is_me);
  document.getElementById('me').innerHTML = me ? meHTML(me,v) : '';

  // 结果横幅
  const banner=document.getElementById('banner');
  if(v.phase==='showdown' && v.result){
    banner.hidden=false;
    let h='🏆 '+v.result.winners.join('、')+(' '+__('赢了'));
    if(v.result.by) h+='（'+v.result.by+'）';
    const hd=v.result.hands||{}; const parts=Object.keys(hd).map(n=>n+':'+hd[n]);
    if(parts.length) h+='<br><span style="color:#9fb3d8">'+parts.join('　')+'</span>';
    banner.innerHTML=h;
  } else banner.hidden=true;

  // 控制区
  renderControls(v, me);

  // 日志
  document.getElementById('log').innerHTML = (v.log||[]).map(x=>'<div>'+x+'</div>').join('');
}

function seatHTML(s,v){
  let cls='seat'; if(s.is_turn)cls+=' turn'; if(s.folded && s.in_hand)cls+=' folded';
  const cards = (s.in_hand && !s.folded) ? `<div class="cards">${(s.hole||[]).map(c=>cardHTML(c,true)).join('')}</div>` : `<div class="cards"></div>`;
  let st=''; if(!s.in_hand && v.phase!=='waiting') st=__('旁观');
  else if(s.folded && s.in_hand) st=__('弃牌'); else if(s.allin) st=__('全下');
  else if(v.phase==='waiting'||v.phase==='showdown') st=(s.ready?('✅'+__('已准备')):__('…未准备'));
  else if(s.last_action) st=s.last_action;
  const bet = (s.committed_round>0 && v.phase!=='waiting' && v.phase!=='showdown') ? ((__('下注')+' ')+s.committed_round) : '';
  const waitp = (v.phase==='waiting'||v.phase==='showdown');
  const stk = waitp ? (s.bought_in?((__('额度')+' ')+s.buyin):__('未进场')) : ((__('筹码')+' ')+s.stack);
  return `<div class="${cls}">
    <div class="nm">${s.name}${s.is_button?'<span class="dealer">D</span>':''}</div>
    ${cards}
    <div class="stk">${stk}</div>
    <div class="betchip">${bet}</div>
    <div class="st">${st}</div>
  </div>`;
}

function meHTML(me,v){
  const inhand = me.in_hand && !me.folded;
  const cards = inhand ? `<div class="cards">${(me.hole||[]).map(c=>cardHTML(c)).join('')}</div>`
                       : (v.phase!=='waiting' && me.in_hand && me.folded ? ('<div class="cards" style="opacity:.4">'+__('已弃牌')+'</div>') : '<div class="cards"></div>');
  let st='';
  if(v.phase==='waiting'||v.phase==='showdown') st = me.buyin>0?(me.ready?('✅ '+__('已准备')):__('点下方“准备”开始')):__('先在下方选择进场额度');
  else if(!me.in_hand) st=__('本局旁观，下一局加入');
  else if(me.folded) st=__('已弃牌');
  else if(me.allin) st=__('全下');
  else if(me.is_turn) st=__('轮到你了！');
  else st=__('等待其他玩家…');
  const timer = (me.is_turn && v.turn_remain!=null) ?
    `<div class="timer"><i style="width:${Math.min(100,v.turn_remain/30*100)}%"></i></div>` : '';
  const waitp=(v.phase==='waiting'||v.phase==='showdown');
  const meStk = waitp ? (me.buyin>0?((__('额度')+' ')+me.buyin):__('未进场')) : ((__('筹码')+' ')+me.stack+(me.committed_round>0?((' · '+__('本轮已下')+' ')+me.committed_round):''));
  return `<div class="me${me.is_turn?' turn':''}">
    <div class="metop"><span class="who">${__('你 {p0}',{p0:(me.is_button?('🔘'+__('庄')):'')})}</span><span class="stk" style="color:#9fe0c0;font-size:12px">${meStk}</span></div>
    ${cards}
    <div style="text-align:center;color:#ffd85a;font-size:12px;min-height:15px">${st}</div>
    ${timer}
  </div>`;
}

function renderControls(v, me){
  const box=document.getElementById('controls');
  if(!me){ box.innerHTML=('<div class="wait">'+__('你不在这张桌子上')+'</div>'); CTRL_SIG='noseat'; return; }
  // 只有影响控制区的状态变了才重建 DOM。否则每次轮询都重建会把你正在拖的滑块弹回去、
  // 还会左右闪。签名相同就直接返回，保住当前的滑块位置。
  const sig=[v.phase,v.my_turn,v.to_call,v.can_check,v.min_raise_to,v.my_stack,v.current_bet,
             v.my_ready,v.my_buyin,v.my_bought_in,v.coins,v.ready_count,v.human_count,
             v.in_room,EDIT_BUY].join('|');
  if(sig===CTRL_SIG && box.innerHTML) return;
  CTRL_SIG=sig;
  // 等待/摊牌：先设进场额度，再准备
  if(v.phase==='waiting' || v.phase==='showdown'){
    const rc=v.ready_count||0, need=v.min_players;
    const coins=v.coins||0, minB=v.min_buyin||20, maxCap=v.max_buyin||500;
    const maxBuy=Math.min(maxCap, coins);
    let html = `<div class="wait">${__('已准备 {p0}/{p1} 人（至少 {p2} 人开局）',{p0:(rc),p1:(v.human_count),p2:(need)})}</div>`;
    if(coins < minB){
      box.innerHTML = html + `<div class="wait" style="color:#ffb0b0">${__('金币不足 {p0}，暂时进不了场，先去别处赚点金币吧～',{p0:(minB)})}</div>`;
      return;
    }
    const bought = me.buyin>0;
    // 没设额度，或点了“改额度”，都显示选择器
    if(!bought || EDIT_BUY){
      // 默认值：优先用玩家上次拖到的值（夹在合法范围内），否则给个合适的起点
      let def = (BUY_VAL!=null ? BUY_VAL : (bought?me.buyin:Math.min(200,maxBuy)));
      def = Math.max(minB, Math.min(def, maxBuy));
      html += `<div class="wait">${__('选择进场额度：每局最多押')} <b style="color:#ffd85a" id="bVal">${def}</b> ${__('金币（封顶 {p0}）',{p0:(maxCap)})}</div>
        <div class="raisebox">
          <input type="range" id="bSld" min="${minB}" max="${maxBuy}" value="${def}" step="10">
        </div>
        <div class="btnrow"><button class="btn ready" id="btnBuy">💰 ${__('以')} <span id="bBtn">${def}</span> ${__('金币进场')}</button></div>`;
      box.innerHTML = html;
      const sld=document.getElementById('bSld');
      const sync=()=>{BUY_VAL=+sld.value;document.getElementById('bVal').textContent=sld.value;document.getElementById('bBtn').textContent=sld.value;};
      sld.oninput=sync;
      document.getElementById('btnBuy').onclick=async()=>{ EDIT_BUY=false; apply(await api('/buyin',{amount:+sld.value})); };
      return;
    }
    // 已设额度：显示额度 + 准备/取消 + 改额度
    html += `<div class="wait">${__('进场额度')} <b style="color:#ffd85a">${me.buyin}</b> ${__('金币/局')}　·　<a id="btnEdit" style="color:#8fa0c8;cursor:pointer;text-decoration:underline">${__('改额度')}</a></div>
      <div class="btnrow"><button class="btn ${me.ready?'unready':'ready'}" id="btnReady">${me.ready?__('取消准备'):('✅ '+__('准备'))}</button></div>`;
    box.innerHTML = html;
    document.getElementById('btnReady').onclick=async()=>{ apply(await api('/ready',{ready:!me.ready})); };
    document.getElementById('btnEdit').onclick=()=>{ EDIT_BUY=true; renderControls(v, me); };
    return;
  }
  // 牌局中
  if(!v.my_turn){
    box.innerHTML = `<div class="wait">${me.in_hand&&!me.folded?__('等待轮到你…'):__('本局你已不在牌局，等下一局')}</div>`;
    return;
  }
  // 轮到我行动
  const toCall=v.to_call||0;
  const maxTarget = me.committed_round + me.stack;   // 我本轮最多能下到
  const minTarget = v.min_raise_to;
  const canRaise = me.stack>0 && maxTarget>=minTarget && maxTarget>v.current_bet;
  let html='<div class="btnrow">';
  html += `<button class="btn fold" id="aFold">${__('弃牌')}</button>`;
  if(v.can_check) html += `<button class="btn check" id="aCheck">${__('过牌')}</button>`;
  else html += `<button class="btn call" id="aCall">${__('跟注 {p0}',{p0:(Math.min(toCall,me.stack))})}</button>`;
  html += `</div>`;
  if(canRaise){
    html += `<div class="raisebox">
      <input type="range" id="rSld" min="${minTarget}" max="${maxTarget}" value="${minTarget}" step="1">
      <span class="raiseval" id="rVal">${minTarget}</span></div>
      <div class="btnrow">
        <button class="btn raise" id="aRaise">${__('加注到')} <span id="rBtnVal">${minTarget}</span></button>
        <button class="btn allin" id="aAllin">${__('全下 {p0}',{p0:(maxTarget)})}</button>
      </div>`;
  } else {
    html += `<div class="btnrow"><button class="btn allin" id="aAllin">${__('全下 {p0}',{p0:(maxTarget)})}</button></div>`;
  }
  box.innerHTML=html;
  const bind=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};
  bind('aFold',async()=>apply(await api('/action',{action:'fold'})));
  bind('aCheck',async()=>apply(await api('/action',{action:'check'})));
  bind('aCall',async()=>apply(await api('/action',{action:'call'})));
  bind('aAllin',async()=>apply(await api('/action',{action:'allin'})));
  const sld=document.getElementById('rSld');
  if(sld){
    const sync=()=>{document.getElementById('rVal').textContent=sld.value;document.getElementById('rBtnVal').textContent=sld.value;};
    sld.oninput=sync;
    bind('aRaise',async()=>apply(await api('/action',{action:'raise',amount:+sld.value})));
  }
}

async function api(path,body){
  const opt={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})};
  return (await fetch('/casino/holdem/'+RID+path, path==='/state'?undefined:opt)).json();
}
function apply(v){ if(v){ if(v.act_error) toast(v.act_error); render(v);} }

document.getElementById('leave').addEventListener('click',async()=>{ try{await api('/leave');}catch(e){} location.href='/casino'; });

let busy=false;
async function poll(){ if(busy)return; busy=true; try{ apply(await (await fetch('/casino/holdem/'+RID+'/state')).json()); }catch(e){} busy=false; }
poll(); setInterval(poll, 1600);
</script>
</body>
</html>
