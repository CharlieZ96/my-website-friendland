{% extends "_entry.html" %}
{% block title %}{{ _('登录') }} - {{ _('JZH乐园') }}{% endblock %}

{% block panel %}
<h1>{{ _('欢迎回来') }}</h1>
<p class="lede">{{ _('JZH 已经在等你了。') }}</p>

{% set flash_class = 'notice' %}{% include "_flash.html" %}

<form method="POST">
    <div class="field">
        <label for="username">{{ _('用户名') }}</label>
        <input id="username" type="text" name="username" autocomplete="username" required>
    </div>
    <div class="field">
        <label for="password">{{ _('密码') }}</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-light btn-block" type="submit">{{ _('登录') }}</button>
</form>

<p class="panel-alt">{{ _('还没有账号？') }}<a href="/register">{{ _('注册，领取你的 JZH') }}</a></p>

{% endblock %}
