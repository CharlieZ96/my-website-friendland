<!DOCTYPE html>
{% from "_appbar.html" import appbar, head with context %}
<html lang="{{ 'en' if lang == 'en' else 'zh-CN' }}">
<head>
    {{ head(_('JZH语录')) }}
    <style>
        .quote { display:flex; flex-direction:column; align-items:center; }
        .quote-frame { margin:0; padding:14px; background:var(--paper); border:1px solid var(--line); border-radius:16px;
                       max-width:100%; }
        .quote-frame img { display:block; max-width:min(860px, 100%); max-height:68vh; border-radius:8px; }
        .quote-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:24px; }
    </style>
</head>
<body>
    {{ appbar(_('JZH语录'), [('/hub', _('返回大厅'))]) }}
    <main class="page quote">
        {% if image %}
        <figure class="quote-frame">
            <img src="{{ url_for('static', filename='gallery/' + image) }}" alt="{{ _('一张随机的 JZH 语录截图') }}">
        </figure>
        <div class="quote-actions">
            <a href="/jzhyl" class="btn btn-primary">{{ _('换一张') }}</a>
            <a href="/hub" class="btn btn-outline">{{ _('返回大厅') }}</a>
        </div>
        {% else %}
        <div class="sheet empty-note" style="max-width:520px;">
            <p style="margin:0 0 6px; color:var(--ink); font-weight:600;">{{ _('还没有语录图片') }}</p>
            <p style="margin:0;">{{ _('把图片放进服务器的 static/gallery/ 文件夹，这里就会随机显示一张。') }}</p>
        </div>
        {% endif %}
    </main>
</body>
</html>
