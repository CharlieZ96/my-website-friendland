<!doctype html><html><head><meta charset="utf-8"><title>ws echo 测试</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script></head>
<body style="font-family:sans-serif;max-width:480px;margin:40px auto">
<h3>WebSocket echo 测试</h3>
<input id="txt" value="你好" style="padding:6px"><button id="send" style="padding:6px 12px">发送</button>
<ul id="log"></ul>
<script>
const socket = io();
function log(s){const li=document.createElement('li');li.textContent=s;document.getElementById('log').appendChild(li);}
socket.on('connect', ()=>log('✅ 已连接 id='+socket.id));
socket.on('disconnect', ()=>log('❌ 断开'));
socket.on('pong_msg', d=>log('⬅ 服务器: '+d.reply));
document.getElementById('send').onclick=()=>{
  const t=document.getElementById('txt').value;
  socket.emit('ping_msg', {text:t}); log('➡ 已发送: '+t);
};
</script></body></html>
