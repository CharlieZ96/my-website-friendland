<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JZH对撞</title>
  <style>
    body { margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#160f0c; color:#f0e6d2; }
    .container { max-width:480px; margin:0 auto; padding:16px; }
    h2 { color:#f5b942; }
    .label { color:#c99a5a; font-size:12px; letter-spacing:2px; margin:14px 0 6px; }
    .row { display:flex; align-items:center; gap:6px; background:#2f2019; border:1px solid #4a3226; border-radius:8px; padding:6px 8px; margin-bottom:5px; }
    .row .idx { width:18px; color:#a08a6f; font-weight:800; }
    .row .cn { flex:1; } .row small { color:#a08a6f; }
    .row button { width:34px; height:32px; font-size:15px; background:transparent; color:#a08a6f; border:1px solid #4a3226; border-radius:6px; cursor:pointer; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:8px; }
    .cardbtn { background:#241812; border:1px solid #4a3226; border-radius:8px; padding:8px; color:#f0e6d2; cursor:pointer; text-align:center; font-size:13px; }
    .cardbtn small { color:#a08a6f; display:block; }
    .submit { width:100%; padding:12px; margin-top:16px; border:none; border-radius:10px; font-weight:800; font-size:16px; background:linear-gradient(180deg,#ffd97a,#f5b942); color:#3a2410; cursor:pointer; }
    .wait { text-align:center; padding-top:60px; font-size:20px; }
  </style>
</head>
<body>
<div class="container">
{% if already %}
  <div class="wait">
    <p>✅ 已提交，等待对手排兵…</p>
    <div style="font-size:40px;">⏳</div>
  </div>
  <script>
    var mid = {{ mid }};
    var t = setInterval(function(){
      fetch('/battle/'+mid+'/state').then(function(r){return r.json();}).then(function(s){
        if (s.status === 'gone') { clearInterval(t); location.href='/battle'; }
        else if (s.status === 'done') { clearInterval(t); location.href='/battle/'+mid+'/result'; }
      });
    }, 2000);
  </script>
{% else %}
  <h2>选择你的JZH · #{{ mid }}</h2>
  <div class="label">出战顺序（前3张随机抽到·必上）· <span id="count">3</span>/7</div>
  <div id="deck"></div>
  <div class="label">从收藏夹选（最多再选4张）</div>
  <div class="grid" id="pool"></div>
  <form id="deckform" method="POST"><input type="hidden" name="deck" id="deckfield"></form>
  <button class="submit" onclick="submitDeck()">确认卡组，开撞！💥</button>
  <script>
    var COLLECTION = {{ collection|tojson }};
    var FORCED = {{ forced|tojson }};
    var deck = FORCED.map(function(c){ var x=Object.assign({},c); x._forced=true; return x; });

    function renderDeck(){
      var dv=document.getElementById('deck'); dv.innerHTML='';
      deck.forEach(function(c,i){
        var div=document.createElement('div'); div.className='row';
        var img = c.image ? '<img src="/uploads/'+c.image+'" style="width:30px;height:42px;object-fit:cover;border-radius:4px;">' : '';
        div.innerHTML='<span class="idx">'+(i+1)+'</span>'+img+
          '<span class="cn">'+c.name+' <small>攻'+c.attack+'/孝'+c.defense+'</small></span>';
        var up=document.createElement('button'); up.textContent='▲'; up.onclick=function(){mv(i,-1)};
        var dn=document.createElement('button'); dn.textContent='▼'; dn.onclick=function(){mv(i,1)};
        div.appendChild(up); div.appendChild(dn);
        if(!c._forced){ var rm=document.createElement('button'); rm.textContent='✕'; rm.style.color='#d64545'; rm.onclick=function(){deck.splice(i,1);renderDeck();}; div.appendChild(rm); }
        dv.appendChild(div);
      });
      document.getElementById('count').textContent=deck.length;
    }

    function renderPool(){
      var pv=document.getElementById('pool'); pv.innerHTML='';
      COLLECTION.forEach(function(c){
        var b=document.createElement('div'); b.className='cardbtn';
        var thumb = c.image ? '<img src="/uploads/'+c.image+'" style="width:80px;height:112px;object-fit:cover;border-radius:6px;display:block;margin:0 auto 4px;">' : '';
        b.innerHTML=thumb+c.name+'<small>攻'+c.attack+'/孝'+c.defense+'</small>';
        b.onclick=function(){ if(deck.length>=7){alert('已满7张');return;} var x=Object.assign({},c);x._forced=false;deck.push(x);renderDeck(); };
        pv.appendChild(b);
      });
    }

    function mv(i,d){ var j=i+d; if(j<0||j>=deck.length)return; var a=deck[i];deck[i]=deck[j];deck[j]=a;renderDeck(); }
    function submitDeck(){
      if(deck.length!==7){alert('需要正好7张（3抽+4选）');return;}
      document.getElementById('deckfield').value=JSON.stringify(deck.map(function(c){return c.id;}));
      document.getElementById('deckform').submit();
    }
    renderDeck(); renderPool();
  </script>
{% endif %}
</div>
</body>
</html>
