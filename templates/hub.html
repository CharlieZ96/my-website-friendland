<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论坛主页</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; flex-direction:column;
               justify-content:center; align-items:center;
               font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#f4f6f8; }
        h1 { color:#333; margin-bottom:8px; }
        .welcome { color:#888; margin-bottom:40px; }
        .btn { display: inline-block; width: 200px; box-sizing: border-box; text-align: center;padding:16px 30px; font-size:18px; border-radius:8px;
               text-decoration:none; background:#4a90e2; color:white; transition:0.2s; margin-bottom:20px;}
        .btn:hover { opacity:0.85; transform:translateY(-2px); }
        .btn2 { display: inline-block; width: 200px; box-sizing: border-box; text-align: center; 
            padding:16px 30px; font-size:18px; border-radius:8px;
                text-decoration:none; background:white; color:#4a90e2;
                border:2px solid #4a90e2; transition:0.2s; margin-bottom:20px;}
        .btn2:hover { opacity:0.85; transform:translateY(-2px); }
        .btn3 { display: inline-block; width: 200px; box-sizing: border-box; text-align: center; 
            padding:16px 30px; font-size:18px; border-radius:8px;
                text-decoration:none; background:rgb(202, 113, 113); color:#fdfdfd;
                border:2px solid #d9345b; transition:0.2s; margin-bottom:20px;}
        .btn3:hover { opacity:0.85; transform:translateY(-2px); }
        .btn4 { display: inline-block; width: 200px; box-sizing: border-box; text-align: center;
            padding:16px 30px; font-size:18px; border-radius:8px;
                text-decoration:none; background:rgb(255, 255, 255); color:#4a90e2;
                border:2px solid #2769b5; transition:0.2s; margin-bottom:20px;}
        .btn4:hover { opacity:0.85; transform:translateY(-2px); }
        .topnav { position:absolute; top:20px; right:24px; display:flex; gap:16px; }
        .topnav a { color:#888; text-decoration:none; font-size:14px; }
    </style>
</head>
<body>
    <div class="topnav">
        <a href="/change_password">修改密码</a>
        <a href="/logout">退出登录</a>
    </div>
    <h1>神秘论坛</h1>
    <p class="welcome">你醒啦，{{ username }}</p>
    <a href="/board" class="btn">进入 →</a>
    <a href="/jzhyl" class="btn2">JZH语录 →</a>
    <a href="/draw" class="btn3">抽取你的JZH</a>
    <a href="/collection" class="btn4">卡册</a>
    {% if is_admin %}
    <a href="/admin/cards" class="btn" style="background:#e67e22;">卡牌管理</a>
    {% endif %}
</body>
</html>
