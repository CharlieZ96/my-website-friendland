<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21点</title>
<style>
  :root{--bg:#06070f;--pink:#ff2e88;--cyan:#27e3ff;--purple:#a06bff;--amber:#ffb54d;--green:#34d17e;--ink:#eaf2ff;--felt:#1c6b4a;}
  *{box-sizing:border-box}
  body{margin:0;background:#06070f;color:var(--ink);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px 10px 40px}
  .wrap{max-width:520px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:13px}
  .top .coins{font-weight:800;background:#141c38;border:2px solid var(--amber);color:var(--amber);border-radius:999px;padding:4px 12px}
  .top .win{color:var(--amber);font-weight:700;font-size:12px;text-shadow:0 0 8px rgba(255,181,77,.5)}
  .leave{cursor:pointer;background:#1a2138;border:2px solid #2a3350;color:#9fb0d8;border-radius:999px;padding:4px 12px;font-weight:700}

  /* 牌桌 */
  .table{position:relative;background:
      radial-gradient(120% 90% at 50% 0%, #24805c 0%, var(--felt) 45%, #145038 100%);
    border:3px solid #6b4a2a;border-radius:22px 22px 26px 26px;padding:12px 12px 16px;
    box-shadow:0 14px 40px rgba(0,0,0,.6), inset 0 0 60px rgba(0,0,0,.35)}
  .felt-arc{position:absolute;left:14px;right:14px;top:96px;height:120px;border:2px dashed rgba(255,255,255,.18);
    border-radius:50%/70px;pointer-events:none}
  .phase{text-align:center;font-weight:800;font-size:14px;margin-bottom:8px;color:#eafff4;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .phase b{color:#fff}
  .phase .lil{font-size:12px;color:#bfe7d6;font-weight:700}

  /* 庄家区 */
  .dealer{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:8px}
  .dtitle{font-size:12px;color:#d9fff0;font-weight:800;display:flex;align-items:center;gap:6px}
  .npc{width:34px;height:44px;image-rendering:pixelated}
  .hand{display:flex;justify-content:center;min-height:64px;align-items:flex-end}
  .hand .pcard{margin-left:-14px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
  .hand .pcard:first-child{margin-left:0}
  .val{display:inline-block;min-width:26px;text-align:center;font-weight:800;font-size:13px;color:#04220f;
    background:#eafff2;border-radius:999px;padding:1px 8px;box-shadow:0 0 8px rgba(0,0,0,.25)}
  .val.bust{background:#ff6a7c;color:#fff}
  .val.bj{background:var(--amber);color:#3a2400}

  /* 玩家座位区 */
  .seats{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 4px;margin-top:6px}
  .seat{flex:0 0 auto;width:112px;background:rgba(4,20,14,.5);border:1.5px solid rgba(255,255,255,.14);
    border-radius:12px;padding:8px 6px;text-align:center;transition:box-shadow .2s, border-color .2s}
  .seat.me{border-color:var(--cyan);box-shadow:0 0 12px rgba(39,227,255,.5)}
  .seat.turn{border-color:var(--amber);box-shadow:0 0 16px rgba(255,181,77,.8);animation:turnpulse 1.1s ease-in-out infinite}
  @keyframes turnpulse{0%,100%{box-shadow:0 0 10px rgba(255,181,77,.5)}50%{box-shadow:0 0 20px rgba(255,181,77,.95)}}
  .seat .who{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:#eafff2;font-weight:700;white-space:nowrap;overflow:hidden}
  .seat .who svg{width:22px;height:22px;image-rendering:pixelated;flex:0 0 auto}
  .seat .bot{color:var(--purple)}
  .seat .hand{min-height:56px}
  .seat .hand .pcard{margin-left:-16px}
  .seat .betchip{margin-top:3px;font-size:11px;color:var(--amber);font-weight:800}
  .rbadge{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px}
  .rb-win{background:var(--green);color:#04250f}.rb-bj{background:var(--amber);color:#3a2400}
  .rb-lose{background:#3a2030;color:#ff9aa8}.rb-push{background:#2a3350;color:#cdd8f5}.rb-bust{background:#ff6a7c;color:#fff}

  .pcard{border-radius:6px}
  @keyframes dealin{from{transform:translateY(-22px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
  .deal{animation:dealin .32s ease-out both}

  /* 控制区 */
  .panel{margin-top:10px}
  .chips{display:flex;gap:8px;justify-content:center;margin:6px 0}
  .chip{cursor:pointer;width:44px;height:44px;border-radius:50%;border:3px dashed #fff6;font-weight:800;font-size:13px;color:#04121a;display:flex;align-items:center;justify-content:center}
  .chip[data-v="5"]{background:#8fe6ff}.chip[data-v="10"]{background:#ffd85a}.chip[data-v="50"]{background:#ff8fbf}.chip[data-v="100"]{background:#b69bff}
  .chip:active{transform:scale(.9)}
  .mybet{text-align:center;font-size:13px;color:#cfe1ff;margin:4px 0}
  .mybet b{color:var(--amber)}
  .ctrls{display:flex;gap:8px;justify-content:center;margin-top:6px}
  .btn{cursor:pointer;border:2px solid #000;border-radius:12px;padding:12px 10px;font-weight:800;font-size:15px;color:#04121a;box-shadow:3px 3px 0 #000;flex:1}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .btn.hit{background:linear-gradient(#8fe6ff,#27e3ff)}
  .btn.stand{background:linear-gradient(#ffd85a,#ffb54d)}
  .btn.double{background:linear-gradient(#c6a3ff,#a06bff);color:#150a2a}
  .btn.deal{background:linear-gradient(#7ef0a8,#34d17e);color:#04250f}
  .btn.clear{background:#1a2138;color:#9fb0d8;border-color:#2a3350;box-shadow:none;flex:0 0 84px}
  .btn.cont{background:linear-gradient(#8fe6ff,#27e3ff);flex:none;padding:12px 30px}
  .waitmsg{text-align:center;color:#cfe1ff;font-size:14px;font-weight:700;margin-top:8px;min-height:20px}

  .log{margin-top:10px;background:#0b1024;border:1px solid #22305a;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.7;color:#9fb0d8;max-height:96px;overflow:auto}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;background:#0a1230;border:2px solid var(--cyan);color:var(--cyan);font-weight:800;font-size:13px;border-radius:10px;padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="coins">🪙<span id="coin">…</span></span>
    <span class="win">🏆<span id="win">—</span></span>
    <span class="leave" id="leave">离开 ↩</span>
  </div>

  <div class="table">
    <div class="felt-arc"></div>
    <div class="phase" id="phase">连接中…</div>

    <!-- 庄家 -->
    <div class="dealer">
      <div class="dtitle">
        <svg class="npc" viewBox="0 0 34 44"><rect x="9" y="2" width="16" height="8" fill="#241b30"/><rect x="10" y="9" width="14" height="9" fill="#e9c39c"/><rect x="13" y="12" width="2" height="2" fill="#222"/><rect x="19" y="12" width="2" height="2" fill="#222"/><rect x="6" y="18" width="22" height="20" fill="#151828"/><rect x="15" y="18" width="4" height="20" fill="#e6edff"/><rect x="12" y="19" width="10" height="3" fill="#ff2e88"/></svg>
        庄家 · 老江 <span class="val" id="dval"></span>
      </div>
      <div class="hand" id="dhand"></div>
    </div>

    <!-- 玩家座位 -->
    <div class="seats" id="seats"></div>
  </div>

  <!-- 控制面板（按阶段切换） -->
  <div class="panel">
    <!-- 下注 -->
    <div id="panelBet" hidden>
      <div class="chips">
        <div class="chip" data-v="5">5</div>
        <div class="chip" data-v="10">10</div>
        <div class="chip" data-v="50">50</div>
        <div class="chip" data-v="100">100</div>
      </div>
      <div class="mybet">本局下注 <b id="mybet">0</b> 🪙 <span id="readyInfo" style="color:#8fbfe6"></span></div>
      <div class="ctrls">
        <button class="btn clear" id="btnClear">撤注</button>
        <button class="btn deal" id="btnDeal">✅ 发牌</button>
      </div>
    </div>

    <!-- 决策 -->
    <div id="panelPlay" hidden>
      <div class="ctrls">
        <button class="btn hit" id="btnHit">🃏 要牌</button>
        <button class="btn stand" id="btnStand">✋ 停牌</button>
        <button class="btn double" id="btnDouble">✖2 双倍</button>
      </div>
      <div class="waitmsg" id="waitMsg"></div>
    </div>

    <!-- 结果 -->
    <div id="panelResult" hidden>
      <div class="waitmsg" id="resultMsg"></div>
      <div class="ctrls" style="justify-content:center">
        <button class="btn cont" id="btnCont">▶ 再来一局</button>
      </div>
    </div>
  </div>

  <div class="log" id="log"></div>
</div>

<div class="toast" id="toast"></div>

<script>const RID = {{ rid }};</script>
<script src="/static/pet_sprite.js"></script>
<script>
let curV=null, sig="";
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1700);}

function cardSVG(card){
  if(!card || card.hidden){
    return `<svg class="pcard deal" viewBox="0 0 44 62" style="width:40px;height:56px">
      <rect x="1" y="1" width="42" height="60" rx="6" fill="#2a2050" stroke="#5a4a8a"/>
      <rect x="5" y="5" width="34" height="52" rx="4" fill="none" stroke="#7a6ac0" stroke-width="1.5"/>
      <text x="22" y="38" font-size="20" text-anchor="middle" fill="#8a78d8">✦</text></svg>`;
  }
  const r=card.r, s=card.s, red=(s==="♥"||s==="♦"), col=red?'#e5484d':'#15162a';
  return `<svg class="pcard deal" viewBox="0 0 44 62" style="width:40px;height:56px">
    <rect x="1" y="1" width="42" height="60" rx="6" fill="#fdfdff" stroke="#c9d2e6"/>
    <text x="8" y="16" font-size="12" font-weight="800" fill="${col}" text-anchor="middle">${r}</text>
    <text x="8" y="26" font-size="10" fill="${col}" text-anchor="middle">${s}</text>
    <text x="22" y="41" font-size="22" fill="${col}" text-anchor="middle">${s}</text>
    <text x="36" y="58" font-size="12" font-weight="800" fill="${col}" text-anchor="middle" transform="rotate(180 36 54)">${r}</text></svg>`;
}
function av(s){try{return petSVG({version:s.version,stage:'adult',hat:s.hat,outfit:s.outfit,hair:s.hair,skin:s.skin,clothes:s.clothes});}catch(e){return '';}}
const RB={win:['rb-win','赢'],bj:['rb-bj','黑杰克!'],lose:['rb-lose','输'],push:['rb-push','平'],bust:['rb-bust','爆'],sit:['','']};

function renderTable(v){
  // 庄家
  const d=v.dealer||{cards:[],value:0};
  document.getElementById('dhand').innerHTML=(d.cards||[]).map(cardSVG).join("");
  const dval=document.getElementById('dval');
  if(d.reveal){ dval.textContent=d.value; dval.className='val'+(d.bust?' bust':(d.blackjack?' bj':'')); }
  else { dval.textContent=d.cards&&d.cards.length? d.value+'+' : ''; dval.className='val'; }
  // 座位
  document.getElementById('seats').innerHTML=(v.seats||[]).map(s=>{
    const me=s.owner===v.me, cls='seat'+(me?' me':'')+(s.is_turn?' turn':'');
    const cards=(s.cards&&s.cards.length)?s.cards.map(cardSVG).join(""):'<span style="color:#9fceb8;font-size:11px">—</span>';
    const valb=(s.cards&&s.cards.length)?`<span class="val ${s.value>21?'bust':(s.result==='bj'?'bj':'')}">${s.value}</span>`:'';
    let badge='';
    if(v.phase==='result' && RB[s.result]){ const [c,t]=RB[s.result]; if(c) badge=`<div class="rbadge ${c}">${t}${s.last_net?(s.last_net>0?' +'+s.last_net:' '+s.last_net):''}</div>`; }
    const bet=s.bet>0?`<div class="betchip">💰${s.bet}</div>`:'';
    return `<div class="${cls}"><div class="who">${av(s)}<span>${me?'你':s.name}</span></div>
      ${s.isBot?'<div class="bot" style="font-size:10px">机器人</div>':'<div style="height:13px"></div>'}
      <div class="hand">${cards}</div>${valb}${bet}${badge}</div>`;
  }).join("");
}

function apply(v){
  if(!v||v.error){toast(v&&v.error||'房间没了');setTimeout(()=>location.href='/casino',1200);return;}
  curV=v;
  document.getElementById('coin').textContent=Math.floor(v.coins||0);
  document.getElementById('win').textContent=v.top_winner?(v.top_winner.owner+' +'+v.top_winner.net):'虚位以待';
  // 只有牌面/阶段/轮次变化才重绘牌桌（避免闪烁 + 让发牌动画只在变化时播）
  const nsig=JSON.stringify({r:v.round,p:v.phase,dl:(v.dealer.cards||[]).length,dr:v.dealer.reveal,
    t:v.turn_owner, s:(v.seats||[]).map(s=>[s.cards.length,s.result,s.bet,s.is_turn])});
  if(nsig!==sig){ sig=nsig; renderTable(v); }

  const ph=document.getElementById('phase');
  const pv={betting:document.getElementById('panelBet'),playing:document.getElementById('panelPlay'),result:document.getElementById('panelResult')};
  ['betting','playing','result'].forEach(k=>pv[k].hidden=(v.phase!==k));

  if(v.phase==='betting'){
    const aloneLike = v.solo || v.human_count<2;   // 单人场，或公共房只有你一个真人 → 不限时
    if(v.solo){
      ph.innerHTML = `<b>下注</b> · 第 ${v.round} 局 <span class="lil">· 单人场不限时</span>`;
    } else if(v.waiting_for_players){
      ph.innerHTML = `<b>下注</b> · 第 ${v.round} 局 <span class="lil">· 等其他玩家加入…不限时</span>`;
    } else {
      ph.innerHTML = `<b>下注</b> · ${v.bet_secs_left}s 后开牌 · 第 ${v.round} 局`;
    }
    document.getElementById('mybet').textContent=v.my_bet||0;
    document.getElementById('btnDeal').textContent = aloneLike ? '✅ 发牌（和机器人玩）'
                                                               : (v.my_ready?'✅ 已准备 · 点取消':'✅ 准备');
    document.getElementById('readyInfo').textContent = aloneLike ? (v.solo?'':'· 也可等真人一起玩')
                                                                 : `· 已准备 ${v.ready_count}/${v.ready_total}`;
  } else if(v.phase==='playing'){
    const turnName = v.turn_owner===v.me ? '你' : (turnDisplay(v));
    ph.innerHTML = v.my_turn ? `<b style="color:#ffe08a">轮到你了！</b> · 要牌 / 停牌 / 双倍`
                             : `<b>${turnName}</b> 决策中… · 第 ${v.round} 局`;
    document.getElementById('btnHit').disabled=!v.my_turn;
    document.getElementById('btnStand').disabled=!v.my_turn;
    const dbl=document.getElementById('btnDouble'); dbl.disabled=!v.can_double; dbl.style.display=v.can_double?'':'none';
    document.getElementById('waitMsg').textContent = v.my_turn?'':'等其他玩家/机器人行动…';
  } else if(v.phase==='result'){
    ph.innerHTML = `<b>本局结束</b> · 第 ${v.round} 局`;
    const mine=(v.seats||[]).find(s=>s.owner===v.me);
    let m='';
    if(mine){ const map={win:'🎉 你赢了！',bj:'🃏 黑杰克！1.5倍！',push:'🤝 平局，退回本金',lose:'😾 输了这局',bust:'💥 爆牌了…',sit:'这局没下注'};
      m=(map[mine.result]||'')+(mine.last_net? (mine.last_net>0?`　+${mine.last_net}🪙`:`　${mine.last_net}🪙`):''); }
    document.getElementById('resultMsg').textContent=m;
    const cont=document.getElementById('btnCont');
    cont.textContent = (v.timed && v.result_secs_left) ? `▶ 再来一局（${v.result_secs_left}s）` : '▶ 再来一局';
  }
  document.getElementById('log').innerHTML=(v.log||[]).map(x=>`<div>${x}</div>`).join("");
}
function turnDisplay(v){const s=(v.seats||[]).find(x=>x.owner===v.turn_owner);return s?(s.isBot?s.name:s.name):'某玩家';}

async function api(path,body){const opt={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})};
  return (await fetch('/casino/bj/'+RID+path, path==='/state'?undefined:opt)).json();}

document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',async()=>{
  const s=await api('/bet',{amount:+c.dataset.v}); if(s.msg&&s.msg!=='下注成功')toast(s.msg); apply(s);
}));
document.getElementById('btnClear').addEventListener('click',async()=>{const s=await api('/clear');if(s.msg)toast(s.msg);apply(s);});
document.getElementById('btnDeal').addEventListener('click',async()=>{const s=await api('/deal');if(s.msg)toast(s.msg);apply(s);});
document.getElementById('btnHit').addEventListener('click',async()=>apply(await api('/action',{action:'hit'})));
document.getElementById('btnStand').addEventListener('click',async()=>apply(await api('/action',{action:'stand'})));
document.getElementById('btnDouble').addEventListener('click',async()=>{const s=await api('/action',{action:'double'});if(s.msg)toast(s.msg);apply(s);});
document.getElementById('btnCont').addEventListener('click',async()=>apply(await api('/next')));
document.getElementById('leave').addEventListener('click',async()=>{await api('/leave');location.href='/casino';});

async function poll(){try{apply(await api('/state'));}catch(e){}}
poll(); setInterval(poll,1500);
</script>
</body>
</html>
