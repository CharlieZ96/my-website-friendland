<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赌场 · 赛博酒吧</title>
<style>
  :root{--bg:#0a0e1a;--bg2:#111832;--pink:#ff2e88;--cyan:#27e3ff;--purple:#a06bff;--amber:#ffb54d;--ink:#eaf2ff;}
  *{box-sizing:border-box}
  body{margin:0;background:#06070f;color:var(--ink);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px 10px 30px}
  .wrap{max-width:480px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .top a{color:#8fa0c8;text-decoration:none;font-size:13px}
  .coins{font-weight:800;background:#141c38;border:2px solid var(--amber);color:var(--amber);border-radius:999px;padding:4px 12px;
    box-shadow:0 0 12px rgba(255,181,77,.4)}

  .scene{position:relative;aspect-ratio:480 / 340;border-radius:14px;overflow:hidden;image-rendering:pixelated;
    background:linear-gradient(#0c1330 0 55%, #0a0f24 55% 70%, #070a18 70% 100%);
    box-shadow:0 14px 40px rgba(0,0,0,.6), inset 0 0 70px rgba(160,107,255,.14)}
  /* 舞台：固定 480×340 的一套构图，再整体等比缩放到当前宽度，手机/电脑同一构图不挤 */
  .stage{position:absolute;top:0;left:0;width:480px;height:340px;transform-origin:top left}

  /* 窗外霓虹城市 */
  .city{position:absolute;left:0;right:0;top:0;height:56%;overflow:hidden}
  .win-frame{position:absolute;left:8px;right:8px;top:8px;bottom:14px;border:3px solid #263056;border-radius:6px;
    box-shadow:inset 0 0 30px rgba(39,227,255,.12)}
  .bld{position:absolute;bottom:0;background:#0e1430}
  .bwin{position:absolute;width:3px;height:3px}
  .blink{animation:bwin 3s steps(1) infinite}
  @keyframes bwin{0%,80%{opacity:1}82%,100%{opacity:.15}}
  .flyer{position:absolute;top:22px;left:-30px;width:10px;height:3px;background:var(--amber);border-radius:2px;
    box-shadow:0 0 8px var(--amber);animation:fly 7s linear infinite}
  @keyframes fly{to{left:110%}}
  /* 雨 */
  .rain i{position:absolute;top:-12%;width:1px;height:14px;background:linear-gradient(transparent,rgba(140,190,255,.7));
    animation:rain linear infinite}
  @keyframes rain{to{transform:translateY(260px)}}

  /* 霓虹招牌 */
  .sign{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-weight:900;font-size:20px;letter-spacing:3px;z-index:4;
    color:#fff;text-shadow:0 0 6px var(--pink),0 0 16px var(--pink),0 0 30px var(--pink);animation:flick 4s infinite}
  .sign b{color:var(--cyan);text-shadow:0 0 6px var(--cyan),0 0 16px var(--cyan)}
  @keyframes flick{0%,18%,22%,60%,63%,100%{opacity:1}20%,61%{opacity:.55}}

  /* 今日大赢家 霓虹灯牌 */
  .winboard{position:absolute;top:40px;left:50%;transform:translateX(-50%);z-index:5;white-space:nowrap;
    font-size:12px;font-weight:800;background:rgba(8,10,22,.7);border:2px solid var(--amber);border-radius:999px;
    padding:4px 14px;color:var(--amber);text-shadow:0 0 8px var(--amber);
    box-shadow:0 0 14px rgba(255,181,77,.5), inset 0 0 10px rgba(255,181,77,.15);animation:wbpulse 2.4s ease-in-out infinite}
  .winboard b{color:#fff;text-shadow:0 0 8px var(--cyan)}
  .winboard .amt{color:#7CFFB2;text-shadow:0 0 8px #34d17e}
  @keyframes wbpulse{0%,100%{box-shadow:0 0 14px rgba(255,181,77,.4), inset 0 0 10px rgba(255,181,77,.12)}
    50%{box-shadow:0 0 22px rgba(255,181,77,.75), inset 0 0 14px rgba(255,181,77,.25)}}

  /* 吧台 */
  .bar{position:absolute;left:0;right:0;bottom:0;height:34%;
    background:linear-gradient(#3a2140,#241634);border-top:3px solid var(--purple);
    box-shadow:0 -6px 20px rgba(160,107,255,.35)}
  .bar::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--cyan);opacity:.5;box-shadow:0 0 10px var(--cyan)}
  .shelf{position:absolute;left:10px;top:-42px;display:flex;gap:6px}
  .bot{width:8px;height:26px;border-radius:2px 2px 0 0;box-shadow:0 0 8px currentColor;animation:glow 2.6s infinite}
  .bot:nth-child(2){animation-delay:.5s}.bot:nth-child(3){animation-delay:1s}.bot:nth-child(4){animation-delay:1.5s}
  @keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.6)}}

  .pix{position:absolute;image-rendering:pixelated}

  /* 调酒师 NPC（吧台里） */
  .barman{left:20px;bottom:22%;width:46px;height:64px}
  .barman .arm{transform-origin:6px 6px;animation:wipe 1.8s ease-in-out infinite}
  @keyframes wipe{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}

  /* 可点击的游戏机器 */
  .machine{cursor:pointer;transition:transform .12s, filter .12s}
  .machine:hover{transform:translateY(-3px);filter:drop-shadow(0 0 10px var(--cyan))}
  .roul{right:146px;bottom:14%;width:118px;height:90px}
  .bj{right:14px;bottom:14%;width:118px;height:90px}
  .wheel{transform-origin:50% 50%;animation:roll 5s linear infinite}
  @keyframes roll{to{transform:rotate(360deg)}}
  .mlabel{position:absolute;z-index:4;font-size:11px;font-weight:800;background:rgba(10,14,26,.85);border:1px solid var(--cyan);
    color:var(--cyan);border-radius:6px;padding:2px 7px;white-space:nowrap;transform:translateX(-50%);box-shadow:0 0 8px rgba(39,227,255,.4)}

  /* 玩家 JZH（往下站，别挡住轮盘/老虎机；会在赌场底部走来走去） */
  .player{left:0;bottom:3%;width:64px;height:82px;z-index:3;transition:left 3.2s linear;animation:bob 2.8s ease-in-out infinite}
  #playerJZH svg{width:100%;height:100%;image-rendering:pixelated}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* 左下角：今日最大输家，蔫蔫地坐在小椅子上，头顶名字 */
  .loser{position:absolute;left:8px;bottom:2%;width:50px;height:84px;z-index:2}
  .loser .lname{position:absolute;top:0;left:0;white-space:nowrap;z-index:3;
    font-size:9px;font-weight:800;color:#ff9aa8;background:rgba(10,14,26,.9);border:1px solid #7a3a48;
    border-radius:6px;padding:1px 6px;box-shadow:0 0 6px rgba(255,90,110,.35)}
  .loser .lchair{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:44px;height:42px;image-rendering:pixelated}
  .loser .ljzh{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);width:40px;height:48px;
    animation:sob 3.2s ease-in-out infinite}
  .loser .ljzh svg{width:100%;height:100%;image-rendering:pixelated}
  @keyframes sob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-1.5px)}}

  /* 对话框 */
  .dlg{margin-top:12px;background:rgba(12,18,40,.96);border:2px solid var(--cyan);border-radius:14px;padding:12px;
    display:flex;gap:12px;box-shadow:0 0 22px rgba(39,227,255,.25)}
  .portrait{flex:0 0 auto;width:56px;height:56px;border-radius:10px;background:#0a1230;border:2px solid var(--pink);overflow:hidden}
  .dtext{flex:1;min-width:0}
  .dname{color:var(--pink);font-weight:800;font-size:13px;margin-bottom:3px;text-shadow:0 0 8px rgba(255,46,136,.6)}
  .dbody{font-size:14px;line-height:1.6;min-height:44px}
  .dnext{margin-top:6px;text-align:right}
  .dnext button{cursor:pointer;background:var(--cyan);color:#04121a;border:none;border-radius:8px;padding:6px 14px;font-weight:800}
  .toast{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:6;background:#0a1230;border:2px solid var(--amber);
    color:var(--amber);font-weight:800;font-size:13px;border-radius:10px;padding:6px 12px;box-shadow:0 0 16px rgba(255,181,77,.5);
    opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  .hint{text-align:center;color:#7f8cb8;font-size:12px;margin-top:10px;line-height:1.7}

  /* 老虎机（可点击进游戏，和轮盘/21点桌子一样有点击效果） */
  .dslot{position:absolute;image-rendering:pixelated;opacity:.92;filter:drop-shadow(0 0 4px rgba(39,227,255,.3))}
  .slotgame{cursor:pointer;z-index:4;transition:transform .12s;animation:slotglow 1.9s ease-in-out infinite}  /* z-index:4→不被小人/吧台挡；一闪一闪提示可点 */
  .slotgame:hover{transform:translateY(-4px)}
  .slotgame:active{transform:scale(.92)}                                            /* 手机点一下有反馈 */
  @keyframes slotglow{0%,100%{filter:drop-shadow(0 0 3px rgba(39,227,255,.45))}50%{filter:drop-shadow(0 0 11px rgba(255,181,77,.9))}}
  .reel-sym{animation:reelflk 1.6s steps(2) infinite}
  .reel-sym.b{animation-delay:.3s}.reel-sym.c{animation-delay:.6s}
  @keyframes reelflk{0%,60%{opacity:1}61%,100%{opacity:.45}}
  /* 站在老虎机前玩的顾客 */
  .slotguy{position:absolute;bottom:22%;width:22px;height:36px;image-rendering:pixelated;z-index:2;animation:bob2 3s ease-in-out infinite}
  @keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .slotguy .arm{transform-origin:left center;animation:pull 2.4s ease-in-out infinite}
  @keyframes pull{0%,68%,100%{transform:translateY(0)}80%{transform:translateY(4px)}}
  .dbulb{animation:dblink 1.4s steps(2) infinite}
  .dbulb:nth-child(even){animation-delay:.5s}
  @keyframes dblink{0%,49%{opacity:1}50%,100%{opacity:.25}}
  /* 路人 */
  .passer{position:absolute;image-rendering:pixelated;z-index:2}
  .leg{transform-origin:top center;animation:step .5s ease-in-out infinite alternate}
  .leg.d{animation-delay:.25s}
  @keyframes step{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
  .street-guy{top:150px;width:12px;height:22px;opacity:.5;animation:cross 12s linear infinite}
  .street-guy.b{top:158px;opacity:.4;animation-duration:16s;animation-delay:-6s}
  @keyframes cross{0%{left:2%}100%{left:96%}}
  .floor-guy{bottom:23%;width:24px;height:38px;opacity:.8;animation:cross2 15s linear infinite}
  @keyframes cross2{0%{left:-28px;transform:scaleX(1)}48%{left:150px;transform:scaleX(1)}
    50%{left:150px;transform:scaleX(-1)}98%{left:-28px;transform:scaleX(-1)}100%{left:-28px;transform:scaleX(1)}}

  /* 进房菜单 */
  .modal-bg{position:fixed;inset:0;background:rgba(4,6,14,.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal-bg[hidden]{display:none}
  .modal{background:#0c1024;border:2px solid var(--cyan);border-radius:16px;padding:20px;max-width:320px;width:100%;
    box-shadow:0 0 26px rgba(39,227,255,.3)}
  .modal h3{margin:0 0 6px;color:var(--cyan);text-shadow:0 0 8px rgba(39,227,255,.5)}
  .modal p{margin:0 0 14px;color:#9fb0d8;font-size:13px;line-height:1.6}
  .mbtn{cursor:pointer;border:2px solid #000;border-radius:10px;padding:11px;font-weight:800;font-size:15px;color:#04121a;box-shadow:3px 3px 0 #000}
  .mbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
  .mbtn.solo{background:linear-gradient(#ff8fbf,#ff2e88);color:#2a0a1a}
  .mbtn.multi{background:linear-gradient(#8fe6ff,#27e3ff)}
  .mbtn.cancel{background:#141a2e;color:#8fa0c8;border:1.5px solid #2a3350;box-shadow:none;
    font-size:13px;font-weight:700;padding:6px 22px;width:auto;align-self:center;border-radius:999px;margin-top:2px}
  /* 饮品商店 */
  .drinklist{display:flex;flex-direction:column;gap:10px;margin:4px 0 14px}
  .drinkcard{display:flex;gap:10px;align-items:center;text-align:left;background:#111634;border:1px solid #26305a;
    border-radius:12px;padding:10px}
  .drinkcard .emo{font-size:26px;line-height:1;width:34px;text-align:center}
  .drinkcard .info{flex:1;min-width:0}
  .drinkcard .dn{font-weight:800;color:#eaf2ff;font-size:14px}
  .drinkcard .dd{color:#9fb0d8;font-size:12px;line-height:1.45;margin-top:2px}
  .drinkcard .buy{flex:none;cursor:pointer;border:2px solid #000;border-radius:9px;padding:7px 10px;font-weight:800;
    font-size:13px;background:linear-gradient(#ffe08a,var(--amber));color:#2a1a04;box-shadow:2px 2px 0 #000;white-space:nowrap}
  .drinkcard .buy:active{transform:translate(2px,2px);box-shadow:0 0 0 #000}
  .drinkcard .buy[disabled]{background:#242c48;color:#6b7aa0;border-color:#2a3350;box-shadow:none;cursor:not-allowed}
  .bagline{color:#cfe1ff;font-size:13px;margin:0 0 12px;background:#0b1330;border:1px dashed #2a3a66;border-radius:10px;padding:8px 10px}
  .bagline b{color:var(--amber)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/hub">← 回主页</a><span class="coins">🪙<span id="coin">…</span> <span style="opacity:.55">·</span> 🧠<span id="spirit">…</span></span></div>

  <div class="scene" id="scene">
   <div class="stage" id="stage">
    <div class="sign">JZH <b>CASINO</b></div>
    <div class="winboard">🏆Today's Big Winner <b id="topWinner">—</b> <span class="amt" id="topAmt"></span></div>
    <div class="toast" id="toast"></div>

    <!-- 窗外城市 + 雨 -->
    <div class="city">
      <div class="win-frame">
        <svg width="100%" height="100%" viewBox="0 0 460 180" preserveAspectRatio="none" style="position:absolute;inset:0">
          <defs>
            <linearGradient id="citySky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#090f2c"/><stop offset="55%" stop-color="#131a42"/><stop offset="100%" stop-color="#25184a"/>
            </linearGradient>
          </defs>
          <rect width="460" height="180" fill="url(#citySky)"/>
          <!-- 月亮 + 星星 -->
          <circle cx="398" cy="28" r="12" fill="#eef0ff" opacity=".9"/><circle cx="393" cy="25" r="10" fill="#101838"/>
          <g fill="#dbe6ff">
            <circle cx="60" cy="22" r="1"/><circle cx="120" cy="15" r="1"/><circle cx="205" cy="20" r="1"/><circle cx="300" cy="16" r="1"/><circle cx="150" cy="33" r="1"/><circle cx="255" cy="30" r="1"/><circle cx="352" cy="44" r="1"/><circle cx="35" cy="40" r="1"/>
          </g>
          <!-- 远景天际线 -->
          <g fill="#182150">
            <rect x="110" y="128" width="20" height="52"/><rect x="150" y="120" width="26" height="60"/><rect x="230" y="108" width="30" height="72"/><rect x="266" y="126" width="22" height="54"/><rect x="376" y="118" width="24" height="62"/>
          </g>
          <!-- 近景高楼 -->
          <g fill="#0c1330">
            <rect x="6" y="86" width="40" height="94"/><rect x="52" y="58" width="30" height="122"/><rect x="88" y="104" width="34" height="76"/><rect x="128" y="44" width="28" height="136"/><rect x="196" y="96" width="36" height="84"/><rect x="300" y="72" width="40" height="108"/><rect x="346" y="50" width="26" height="130"/><rect x="404" y="90" width="34" height="90"/>
          </g>
          <!-- 抽象霓虹广告牌（发光色块，无文字/汉字） -->
          <g>
            <rect x="49" y="64" width="14" height="22" fill="#ff2e88" opacity=".22"/><rect x="52" y="64" width="8" height="22" fill="#ff2e88" opacity=".9"/>
            <rect x="132" y="58" width="20" height="4" fill="#27e3ff" opacity=".5"/><rect x="128" y="52" width="28" height="4" fill="#27e3ff" opacity=".95"/>
            <rect x="346" y="56" width="26" height="5" fill="#ffb54d" opacity=".9"/><rect x="352" y="63" width="14" height="3" fill="#ffb54d" opacity=".5"/>
            <rect x="300" y="80" width="6" height="16" fill="#a06bff" opacity=".85"/>
          </g>
          <!-- 楼窗灯光（JS 生成，部分闪烁） -->
          <g id="winLights"></g>
        </svg>
        <!-- 招牌霓虹（英文品牌，无汉字装饰） -->
        <div style="position:absolute;left:250px;top:40px;font-size:9px;font-weight:900;color:var(--cyan);text-shadow:0 0 8px var(--cyan);animation:flick 5s infinite">JZH</div>
        <div class="flyer"></div>
        <!-- 窗外街上走过的路人剪影 -->
        <svg class="passer street-guy" viewBox="0 0 12 22"><rect x="3" y="0" width="6" height="7" fill="#0a0f24"/><rect x="2" y="7" width="8" height="9" fill="#0a0f24"/><rect class="leg" x="3" y="16" width="3" height="6" fill="#0a0f24"/><rect class="leg d" x="6" y="16" width="3" height="6" fill="#0a0f24"/></svg>
        <svg class="passer street-guy b" viewBox="0 0 12 22"><rect x="3" y="0" width="6" height="7" fill="#0a0f24"/><rect x="2" y="7" width="8" height="9" fill="#0a0f24"/><rect class="leg" x="3" y="16" width="3" height="6" fill="#0a0f24"/><rect class="leg d" x="6" y="16" width="3" height="6" fill="#0a0f24"/></svg>
        <div class="rain" id="rain"></div>
      </div>
    </div>

    <!-- 吧台 -->
    <div class="bar">
      <div class="shelf">
        <span class="bot" style="color:#27e3ff;background:#27e3ff"></span>
        <span class="bot" style="color:#ff2e88;background:#ff2e88"></span>
        <span class="bot" style="color:#ffb54d;background:#ffb54d"></span>
        <span class="bot" style="color:#a06bff;background:#a06bff"></span>
      </div>
    </div>

    <!-- 调酒师 NPC -->
    <svg class="pix barman" id="barman" style="cursor:pointer" viewBox="0 0 46 64">
      <rect x="14" y="2" width="18" height="10" fill="#2a2038"/>          <!-- 头发 -->
      <rect x="15" y="9" width="16" height="10" fill="#e9c39c"/>          <!-- 脸 -->
      <rect x="18" y="12" width="4" height="2" fill="#222"/><rect x="25" y="12" width="4" height="2" fill="#222"/>
      <rect x="10" y="19" width="26" height="26" fill="#171a2c"/>         <!-- 马甲 -->
      <rect x="21" y="19" width="4" height="26" fill="#e6edff"/>          <!-- 衬衫 -->
      <rect x="18" y="20" width="10" height="4" fill="var(--pink)"/>      <!-- 领结 -->
      <g class="arm"><rect x="34" y="24" width="10" height="4" fill="#e9c39c"/><rect x="42" y="22" width="6" height="6" fill="#cfe0ff"/></g>
    </svg>

    <!-- 轮盘赌桌（庄家站桌后，可点击进入） -->
    <svg class="pix machine roul" id="mRoul" viewBox="0 0 120 90">
      <!-- 庄家（荷官） -->
      <g>
        <rect x="51" y="3" width="18" height="9" fill="#241b30"/>
        <rect x="52" y="10" width="16" height="10" fill="#e9c39c"/>
        <rect x="55" y="13" width="3" height="2" fill="#222"/><rect x="62" y="13" width="3" height="2" fill="#222"/>
        <rect x="47" y="20" width="26" height="26" fill="#151828"/>
        <rect x="58" y="20" width="4" height="26" fill="#e6edff"/>
        <rect x="54" y="21" width="12" height="3" fill="var(--pink)"/>
        <rect x="41" y="23" width="7" height="4" fill="#e9c39c"/><rect x="72" y="23" width="7" height="4" fill="#e9c39c"/>
        <rect x="77" y="18" width="18" height="2" rx="1" fill="#caa06a" transform="rotate(28 77 20)"/>  <!-- 收耙子 -->
      </g>
      <!-- 桌子（立体：木边 + 侧板 + 桌腿 + 绿绒台面） -->
      <ellipse cx="60" cy="66" rx="56" ry="17" fill="#3a2418"/>
      <path d="M5 66 L7 80 Q60 90 113 80 L115 66 Z" fill="#2b1a10"/>
      <rect x="20" y="78" width="5" height="10" fill="#241108"/><rect x="95" y="78" width="5" height="10" fill="#241108"/>
      <ellipse cx="60" cy="64" rx="52" ry="15" fill="#1c5a40"/>
      <ellipse cx="60" cy="64" rx="52" ry="15" fill="none" stroke="#2f7a58" stroke-width="1"/>
      <!-- 轮盘（台面左侧，转动） -->
      <g>
        <circle cx="34" cy="63" r="14" fill="#241026"/><circle cx="34" cy="63" r="11" fill="#0b0a14"/>
        <g>
          <path d="M34 63 L34 52 A11 11 0 0 1 42 56 Z" fill="#ff2e88"/>
          <path d="M34 63 L42 56 A11 11 0 0 1 45 63 Z" fill="#0b0a14"/>
          <path d="M34 63 L45 63 A11 11 0 0 1 42 70 Z" fill="#27e3ff"/>
          <path d="M34 63 L42 70 A11 11 0 0 1 34 74 Z" fill="#0b0a14"/>
          <path d="M34 63 L34 74 A11 11 0 0 1 26 70 Z" fill="#ff2e88"/>
          <path d="M34 63 L26 70 A11 11 0 0 1 23 63 Z" fill="#0b0a14"/>
          <path d="M34 63 L23 63 A11 11 0 0 1 26 56 Z" fill="#27e3ff"/>
          <path d="M34 63 L26 56 A11 11 0 0 1 34 52 Z" fill="#0b0a14"/>
          <animateTransform attributeName="transform" type="rotate" from="0 34 63" to="360 34 63" dur="6s" repeatCount="indefinite"/>
        </g>
        <circle cx="34" cy="63" r="3" fill="var(--amber)"/>
      </g>

<script>window.__SHOW_TUT__ = {{ 'true' if show_tutorial else 'false' }};</script>
<script src="/static/pet_sprite.js"></script>
<script>
  // 雨滴
  const rain=document.getElementById('rain');
  for(let i=0;i<22;i++){const d=document.createElement('i');d.style.left=(Math.random()*100)+'%';
    d.style.animationDuration=(0.5+Math.random()*0.5)+'s';d.style.animationDelay=(Math.random())+'s';
    d.style.opacity=0.3+Math.random()*0.5;rain.appendChild(d);}

  // 窗外高楼的窗户灯光（随机点亮，部分闪烁）
  (function(){
    const g=document.getElementById('winLights'); if(!g) return;
    const NS='http://www.w3.org/2000/svg';
    const blds=[[6,86,40,94],[52,58,30,122],[88,104,34,76],[128,44,28,136],[196,96,36,84],[300,72,40,108],[346,50,26,130],[404,90,34,90]];
    const cols=['#ffcf6a','#ffd98a','#8fe6ff','#ff9ec8'];
    blds.forEach(([bx,by,bw,bh])=>{
      for(let y=by+7; y<by+bh-5; y+=9){
        for(let x=bx+5; x<bx+bw-4; x+=8){
          if(Math.random()<0.45) continue;                 // 部分窗不亮
          const r=document.createElementNS(NS,'rect');
          r.setAttribute('x',x); r.setAttribute('y',y); r.setAttribute('width',3); r.setAttribute('height',4);
          r.setAttribute('fill',cols[Math.floor(Math.random()*cols.length)]);
          r.setAttribute('opacity',(0.45+Math.random()*0.5).toFixed(2));
          if(Math.random()<0.22){ r.setAttribute('class','blink'); r.style.animationDelay=(Math.random()*3).toFixed(2)+'s'; }
          g.appendChild(r);
        }
      }
    });
  })();

  function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1800);}

  // 让整个赌场场景等比缩放到当前宽度：手机/电脑保持同一套构图，宽度变窄也不会挤在一起
  function fitStage(){
    const scene=document.getElementById('scene'), stage=document.getElementById('stage');
    if(!scene||!stage) return;
    stage.style.transform='scale('+(scene.clientWidth/480)+')';
  }
  fitStage();
  window.addEventListener('resize', fitStage);

  // 读大厅数据：金币 / 精神值 / 今日大赢家 / 你自己的 JZH / 饮品菜单+背包
  let LOBBY = {my_drinks:[], drinks_catalog:[], drink_hold_max:2, spirit:0};
  async function loadLobby(){
    try{
      const s=await (await fetch('/casino/lobby')).json();
      LOBBY = s;
      document.getElementById('coin').textContent=Math.floor(s.coins||0);
      document.getElementById('spirit').textContent=Math.floor(s.spirit||0);
      const tw=s.top_winner;
      if(tw){ document.getElementById('topWinner').textContent=tw.owner; document.getElementById('topAmt').textContent='+'+tw.net+'🪙'; }
      else { document.getElementById('topWinner').textContent='虚位以待'; document.getElementById('topAmt').textContent=''; }
      if(s.sprite && typeof petSVG==='function'){
        const sp=s.sprite;
        const el=document.getElementById('playerJZH');
        const sig=JSON.stringify(sp);
        if(sig!==el._sig){                      // 外观变了才重画（每 8 秒轮询时不打断走动）
          el.innerHTML=petSVG({version:sp.version,stage:'adult',hat:sp.hat,outfit:sp.outfit,hair:sp.hair,skin:sp.skin,clothes:sp.clothes});
          el._sig=sig;
          const svg=el.querySelector('svg'); if(svg && el._face) svg.style.transform=el._face;  // 重画后保持朝向
        }
        startWander(el);                        // 只启动一次
      }
      // 今日最大输家：坐在左下角椅子上，头顶名字（今天还没人亏就只留一把空椅子）
      const tl=s.top_loser, lz=document.getElementById('loserJZH'), ln=document.getElementById('loserName');
      if(tl && tl.sprite && typeof petSVG==='function'){
        const lsig=JSON.stringify(tl);
        if(lsig!==lz._sig){
          const lp=tl.sprite;
          lz.innerHTML=petSVG({version:lp.version,stage:'adult',hat:lp.hat,outfit:lp.outfit,hair:lp.hair,skin:lp.skin,clothes:lp.clothes});
          lz._sig=lsig;
        }
        ln.textContent=tl.owner+' '+tl.net+'🪙'; ln.hidden=false; lz.hidden=false;   // 名字 + 亏了多少（net 本就是负数）
      }else{
        lz.hidden=true; ln.hidden=true;
      }
      const dm=document.getElementById('drinkModal');
      if(dm && !dm.hidden) renderShop();     // 商店开着就同步刷新
    }catch(e){ console.error('大厅数据读取失败',e); }
  }
  // 玩家 JZH 在赌场底部走来走去（只左右移动，纵向永远贴最下面，不会挡到机器）
  function startWander(el){
    if(el._walking) return;                 // 只启动一次
    el._walking=true;
    const stage=document.getElementById('stage');
    const DW=(stage&&stage.offsetWidth)||480;               // 舞台设计宽度(480，不受缩放影响)
    const LEFT=72;                                          // 左下角留给“今日最大输家”的椅子，别踩上去
    el.style.left=Math.round(DW*0.45)+'px';                 // 初始站中间偏左
    function step(){
      if(!document.body.contains(el)){ el._walking=false; return; }
      const span=Math.max(20, DW-70-LEFT);                  // 留出小人宽度 + 左下角椅子，别走出画面
      const nx=LEFT+Math.random()*span;
      const cur=parseFloat(el.style.left)||0;
      el._face=(nx<cur?'scaleX(-1)':'scaleX(1)');            // 朝着走的方向
      const svg=el.querySelector('svg'); if(svg) svg.style.transform=el._face;
      el.style.left=nx+'px';
      setTimeout(step, 3000+Math.random()*3500);
    }
    setTimeout(step, 600);
  }

  loadLobby();
  setInterval(loadLobby, 8000);

  // ===== 老江的饮品店 =====
  const drinkModal=document.getElementById('drinkModal');
  function bagText(){
    const held=LOBBY.my_drinks||[], cat=LOBBY.drinks_catalog||[];
    const nmeOf=k=>{const c=cat.find(x=>x.kind===k);return c?c.emoji+c.name:k;};
    return held.length ? held.map(nmeOf).join('、') : '空';
  }
  function renderShop(){
    const max=LOBBY.drink_hold_max||2, held=LOBBY.my_drinks||[], sp=Math.floor(LOBBY.spirit||0);
    document.getElementById('dmSpirit').textContent=sp;
    document.getElementById('bagLine').innerHTML='背包（'+held.length+'/'+max+'）：<b>'+bagText()+'</b> · 精神值🧠<b id="dmSpirit">'+sp+'</b>';
    const list=document.getElementById('drinkList'); list.innerHTML='';
    (LOBBY.drinks_catalog||[]).forEach(d=>{
      const full=held.length>=max, poor=sp<d.cost;
      const dis=full||poor;
      const card=document.createElement('div'); card.className='drinkcard';
      card.innerHTML='<div class="emo">'+d.emoji+'</div>'+
        '<div class="info"><div class="dn">'+d.name+' <span style="color:#ffd479;font-size:12px">🧠'+d.cost+'</span></div>'+
        '<div class="dd">'+d.desc+'</div></div>'+
        '<button class="buy" data-k="'+d.kind+'"'+(dis?' disabled':'')+'>'+
        (full?'背包满':(poor?'精神不足':'买'))+'</button>';
      list.appendChild(card);
    });
    list.querySelectorAll('.buy').forEach(b=>b.addEventListener('click',()=>buyDrink(b.dataset.k)));
  }
  async function buyDrink(kind){
    try{
      const r=await (await fetch('/casino/drinks/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind})})).json();
      if(r.spirit!==undefined) LOBBY.spirit=r.spirit;
      if(r.my_drinks!==undefined) LOBBY.my_drinks=r.my_drinks;
      document.getElementById('spirit').textContent=Math.floor(LOBBY.spirit||0);
      renderShop();
      toast(r.msg||'');
    }catch(e){ toast('买失败,稍后再试'); }
  }
  function openShop(){ renderShop(); drinkModal.hidden=false; }
  document.getElementById('dmClose').addEventListener('click',()=>{ drinkModal.hidden=true; });
  drinkModal.addEventListener('click',e=>{ if(e.target.id==='drinkModal') drinkModal.hidden=true; });
  document.getElementById('dmTut').addEventListener('click',()=>{ drinkModal.hidden=true; showDlg(); });

  // 教学对话（首次进场自动弹；点吧台里的老江可重听）
  const lines=[
    '哟，新面孔。欢迎来到JZH赌场——先送你 <b style="color:var(--amber)">30枚金币</b> 压压惊。',
    '这里的金币就是你打工赚的那份。赢了能拿去买装饰，输了…就当请我喝一杯咯。',
    '想玩就点场景里的玩意儿：<b style="color:#27e3ff">🎡轮盘</b>是大家对着同一个盘下注一起开；<b style="color:#27e3ff">🃏21点</b>正在筹备中。',
    '一个人来也不怕，我给你叫两个"机器人"陪你凑一桌。想约朋友就进3P房。',
    '对了，我这吧台还卖<b style="color:var(--amber)">一点神秘小玩意儿</b>——但那玩意儿可不是金币能买到的。想买或想再听规则，点我一下就行。'
  ];
  const body=document.getElementById('dbody'), next=document.getElementById('dnext'), dlg=document.getElementById('dlg');
  let i=0;
  function showDlg(){ i=0; body.innerHTML=lines[0]; next.textContent='下一句 ▶'; dlg.style.display='flex'; }
  function hideDlg(){ dlg.style.display='none'; }
  next.addEventListener('click',()=>{
    i++;
    if(i>=lines.length){ hideDlg(); toast('老江回到吧台啦 · 想再听点他就行'); return; }
    body.innerHTML=lines[i];
    if(i===lines.length-1) next.textContent='知道啦';
  });
  document.getElementById('barman').addEventListener('click', openShop);   // 点老江 → 开饮品店（里面能再听规则）
  if(window.__SHOW_TUT__) showDlg(); else hideDlg();

  // 点机器 → 进房菜单
  const modal=document.getElementById('roomModal');
  document.getElementById('mRoul').addEventListener('click',()=>{ modal.hidden=false; });
  document.getElementById('mBj').addEventListener('click',()=>toast('🃏21点马上就来，先玩轮盘吧~'));
  document.querySelectorAll('.slotgame').forEach(el=>el.addEventListener('click',()=>{ location.href='/casino/slots'; }));  // 点老虎机→进游戏
  modal.querySelector('.cancel').addEventListener('click',()=>{ modal.hidden=true; });
  modal.addEventListener('click',e=>{ if(e.target.id==='roomModal') modal.hidden=true; });
  async function enterRoom(mode){
    try{
      const url = mode==='solo' ? '/casino/roulette/create' : '/casino/roulette/join';
      const b = mode==='solo' ? JSON.stringify({mode:'solo'}) : '{}';
      const r=await (await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:b})).json();
      if(r.room) window.location.href='/casino/roulette/'+r.room;
      else toast('进房失败,稍后再试');
    }catch(e){ toast('进房失败,稍后再试'); }
  }
  modal.querySelector('.solo').addEventListener('click',()=>enterRoom('solo'));
  modal.querySelector('.multi').addEventListener('click',()=>enterRoom('multi'));
</script>
</body>
</html>
