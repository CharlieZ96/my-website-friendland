<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽卡</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#f4f6f8; }
        .result { background:white; border-radius:12px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,0.1); text-align:center; width:220px; margin-bottom:20px; }
        .result img { width:100%; height:180px; object-fit:cover; border-radius:8px; }
        .result .name { font-weight:bold; font-size:18px; margin:8px 0 2px; }
        .result .rarity { color:#e67e22; }
        .result .stat { color:#555; }
        .btn { padding:14px 40px; background:#4a90e2; color:white; border:none; border-radius:8px; font-size:18px; cursor:pointer; }
        .nav { margin-top:16px; }
        .nav a { color:#888; text-decoration:none; margin:0 8px; font-size:14px; }
    </style>
</head>
<body>
    {% if result %}
    <div class="result">
        {% if result[4] %}<img src="/uploads/{{ result[4] }}">{% endif %}
        <div class="name">{{ result[1] }}</div>
        <div class="rarity">{{ result[5] }}</div>
        <div class="stat">攻击力 {{ result[2] }} / 孝心值 {{ result[3] }}</div>
    </div>
    {% endif %}
    <form method="POST"><button type="submit" class="btn">抽一张 🎴</button></form>
    <div class="nav">
        <a href="/collection">我的收藏夹</a>
        <a href="/hub">返回主页</a>
    </div>
</body>
</html>
