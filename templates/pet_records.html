<!DOCTYPE html>
{% from "_appbar.html" import appbar, head with context %}
<html lang="{{ 'en' if lang == 'en' else 'zh-CN' }}">
<head>
{{ head(_('成长记录册')) }}
<style>
  :root{--sky:#f3eef0;--paper:#fff;--ink:#1e2230;--muted:#5d6372;--grape:#6b1a2b;--line:#e4dcdf;--green:#7fa892;}
  body{background:var(--sky);line-height:normal}
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 56px}
  .rhead{margin:0 0 16px}
  .rhead h1{margin:0;font-size:26px;font-weight:600}
  .count{color:var(--muted);font-size:14px;margin:6px 0 0}
  .tools{display:flex;gap:8px;margin:0 0 16px}
  .tbtn{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 14px}
  .tbtn:hover{color:var(--claret);border-color:var(--claret)}

  .life{background:var(--paper);border-radius:18px;border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
  .life.current{border-color:var(--claret);box-shadow:0 0 0 1px var(--claret)}
  summary.lhead{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none;padding:14px 16px;user-select:none}
  summary.lhead::-webkit-details-marker{display:none}
  summary.lhead:hover{background:#fbf8f9}
  .lhead svg{width:60px;height:60px;image-rendering:pixelated;flex:0 0 auto}
  .lmeta{flex:1 1 auto;min-width:0}
  .lname{font-size:18px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .gen{font-size:12px;background:var(--grape);color:#fff;border-radius:999px;padding:2px 9px;font-weight:600}
  .ver{font-size:11px;background:#f1ecee;color:var(--muted);border-radius:999px;padding:2px 8px;font-weight:600}
  .alive{font-size:11px;background:var(--green);color:#fff;border-radius:999px;padding:2px 8px;font-weight:600}
  .lsub{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.6}
  .chev{flex:0 0 auto;color:var(--muted);font-size:15px;transition:transform .18s;margin-left:4px}
  details[open] > summary .chev{transform:rotate(90deg)}

  .logs{padding:2px 16px 14px;font-size:14px;line-height:1.85;color:var(--ink);max-height:360px;overflow:auto}
  .logs .inner{border-top:1px dashed var(--line);padding-top:10px}
  .logs div.e{padding:1px 0}
  .logs .t{color:#9aa0ab;font-size:11px;margin-left:6px}
  .logs .none{color:#9aa0ab;font-size:13px}
  .empty{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px 16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
{{ appbar(_('成长记录册'), [('/pet', _('回养成页'))]) }}
<div class="wrap">
  <div class="rhead">
    <h1>{{ _('成长记录册') }}</h1>
    <p class="count" id="count"></p>
  </div>
  <div class="tools" id="tools" hidden>
    <button class="tbtn" id="openAll">{{ _('展开全部') }}</button>
    <button class="tbtn" id="closeAll">{{ _('收起全部') }}</button>
  </div>
  <div id="list"></div>
</div>

<script src="/static/pet_sprite.js"></script>
<script>
const CAUSE = {
  neglect: __("疏于照顾，没能留住它") + " 😢",
  natural: __("寿终正寝，自然老去") + " 🌥️",
  bred:    __("养育后代之后，安然老去") + " 🌥️",
  "":      __("化作了一朵云") + " 🌥️",
};

async function load(){
  let S;
  try{ S = await (await fetch('/pet/state')).json(); }
  catch(e){ document.getElementById('list').innerHTML='<div class="empty">'+esc(__('读取失败，稍后再试～'))+'</div>'; return; }

  const lives = (S.lives||[]).slice();       // 每只JZH一段生平
  const listEl = document.getElementById('list');
  const cntEl  = document.getElementById('count');

  // 过滤掉完全空白（没名字、没记录）的生平，避免刷屏
  const shown = lives.filter(l => (l.name && l.name.length) || (l.log && l.log.length));
  if(!shown.length){
    cntEl.textContent = "";
    listEl.innerHTML = '<div class="empty">'+esc(__('还没有记录～给JZH起个名字、带它去牧场，故事就开始啦。'))+'</div>';
    return;
  }
  cntEl.textContent = __('至今一共养育过 {n} 只JZH · 点标题可展开/收起', {n: shown.length});
  document.getElementById('tools').hidden = false;

  // 从新到旧：最后一段（当前这只）排最上面
  const ordered = shown.slice().reverse();
  const lastNo = lives.length ? lives[lives.length-1].no : -1;

  listEl.innerHTML = ordered.map((l, idx)=>{
    const isCurrent = (l.no === lastNo) && !l.died;
    const openThis  = isCurrent || idx === 0;   // 当前这只（或最新一只）默认展开，其余收起
    const svg = avatar(l, isCurrent, S);
    const name = l.name && l.name.length ? l.name : __('未命名');
    const gen  = __('第 {n} 代', {n: l.no});
    const ver  = l.version || 'v1';
    const born = l.born_str ? __('出生于 {d}', {d: l.born_str}) : '';
    const n    = (l.log && l.log.length) ? l.log.length : 0;
    let status;
    if(l.died){ status = __('结局：') + (CAUSE[l.cause] || CAUSE['']); }
    else { status = __('目前在世，正在被你养育中'); }
    const sub = [born, status, __('{n} 条记录', {n: n})].filter(Boolean).join(' · ');

    const logs = n
      ? l.log.map(e=>`<div class="e">${esc(e.text)}<span class="t">${esc(e.t||'')}</span></div>`).join("")
      : '<div class="none">'+esc(__('这一只还没有留下记录～'))+'</div>';

    return `<details class="life ${isCurrent?'current':''}" ${openThis?'open':''}>
      <summary class="lhead">${svg}
        <div class="lmeta">
          <div class="lname">${esc(name)} <span class="gen">${gen}</span> <span class="ver">${esc(ver)}</span>${isCurrent?'<span class="alive">'+esc(__('在世'))+'</span>':''}</div>
          <div class="lsub">${esc(sub)}</div>
        </div>
        <span class="chev">▸</span>
      </summary>
      <div class="logs"><div class="inner">${logs}</div></div>
    </details>`;
  }).join("");

  // 全部展开 / 全部收起
  document.getElementById('openAll').onclick  = ()=>document.querySelectorAll('details.life').forEach(d=>d.open=true);
  document.getElementById('closeAll').onclick = ()=>document.querySelectorAll('details.life').forEach(d=>d.open=false);
}

// 画头像：化云的显示云；当前在世的用它现在真实的样子；其它用该版本的成年默认样子
function avatar(life, isCurrent, S){
  try{
    if(life.died) return petSVG({version:life.version||'v1', stage:'cloud'});
    if(isCurrent) return petSVG(S);
    return petSVG({version:life.version||'v1', stage:'adult', hat:'光头', outfit:0, hair:0, skin:0});
  }catch(e){ return '<svg width="60" height="60"></svg>'; }
}

function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

load();
</script>
</body>
</html>
