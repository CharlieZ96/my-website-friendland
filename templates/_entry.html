<!DOCTYPE html>
<html lang="{{ 'en' if lang == 'en' else 'zh-CN' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6b1a2b">
    <title>{% block title %}{{ _('JZH乐园') }}{% endblock %}</title>
    <link rel="preload" href="{{ url_for('static', filename='fonts/marcellus-latin-400.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/jzh.css') }}">
</head>
<body>
{% macro lang_switch() %}
<nav class="lang" aria-label="语言 / Language">
    <a href="{{ lang_url('zh') }}" lang="zh-CN"{% if lang == 'zh' %} aria-current="true"{% endif %}>中文</a>
    <a href="{{ lang_url('en') }}" lang="en"{% if lang == 'en' %} aria-current="true"{% endif %}>English</a>
</nav>
{% endmacro %}
<main class="entry">
    <section class="entry-stage" aria-label="JZH">
        <div class="stage-top">
            {% block stage_top %}
            <a class="mark" href="/"><span class="mark-latin">JZH</span><span class="mark-cjk">{{ _('乐园') }}</span></a>
            {% endblock %}
        </div>
        <img class="stage-figure" src="{{ url_for('static', filename='jzh/skins/red/full.webp') }}"
             alt="{{ _('JZH：戴眼镜、穿酒红女仆装的黑发鲸鱼少女') }}" width="832" height="1216">
        <div class="stage-foot">{{ lang_switch() }}</div>
    </section>

    <section class="entry-panel frill">
        <div class="panel-inner">
            {% block panel %}{% endblock %}
            <div class="panel-lang">{{ lang_switch() }}</div>
        </div>
    </section>
</main>
{% block after %}{% endblock %}
</body>
</html>
