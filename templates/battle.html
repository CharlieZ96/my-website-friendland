<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对战中</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; flex-direction:column; justify-content:center;
               align-items:center; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#160f0c; color:#f0e6d2; }
        #status-text { font-size:20px; }
        .spin { font-size:40px; margin:16px; }
        a { color:#a08a6f; margin-top:20px; text-decoration:none; }
    </style>
</head>
<body>
    <h2>对局 #{{ mid }}</h2>
    <p id="status-text">正在匹配对手…</p>
    <div class="spin">⏳</div>
    <p style="color:#a08a6f;">你：{{ me }}</p>
    <button id="cancel-btn" onclick="leave()"
        style="margin-top:16px; padding:10px 24px; border:1px solid #4a3226; background:transparent; color:#a08a6f; border-radius:8px; cursor:pointer;">
        取消匹配
    </button>

    <script>
    var mid = {{ mid }};
    var me = "{{ me }}";
    var timer = setInterval(poll, 2000);
    poll();   // 立即查一次

    function poll() {
        fetch('/battle/' + mid + '/state')
            .then(function (r) { return r.json(); })
            .then(function (s) {
                if (s.status === 'gone') {                 // 局没了（对手退出）
                    clearInterval(timer);
                    document.getElementById('status-text').textContent = '对手离开了，正在返回大厅…';
                    setTimeout(function(){ location.href = '/battle'; }, 1200);
                } else if (s.status === 'building' || s.status === 'ready') {
                clearInterval(timer);
                location.href = '/battle/' + mid + '/build';    // 配上了 → 去排兵
                }
            });
    }
    function leave() {
        fetch('/battle/' + mid + '/leave', { method: 'POST' })
            .then(function () { location.href = '/battle'; });
    }
    </script>
</body>
</html>
